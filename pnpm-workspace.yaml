patchedDependencies:
  "@aws-amplify/auth": patches/@aws-amplify__auth.patch
  app-builder-lib@26.8.1: patches/app-builder-lib@26.8.1.patch
# pnpm 12 will not skip a dependency's build scripts silently: every package that has one must
# be decided here, or the install fails with ERR_PNPM_IGNORED_BUILDS. Under pnpm 10 anything
# missing from the old `onlyBuiltDependencies` was skipped without a word, so these are
# deliberate decisions rather than migration bookkeeping. `pnpm approve-builds <pkg> '!<pkg>'`
# maintains this map non-interactively.
#
# Note the key is `allowBuilds` in pnpm 12 — `onlyBuiltDependencies` and
# `ignoredBuiltDependencies` are the pnpm 10 spelling and are silently inert here.
allowBuilds:
  # Its postinstall downloads the `sentry-cli` binary that `@sentry/vite-plugin` needs in order
  # to upload sourcemaps. The plugin is only enabled when SENTRY_AUTH_TOKEN and the org/project
  # variables are set, which happens in `release.yml` alone — so skipping this build (as pnpm 10
  # silently did) would have broken nothing until a release, which is the worst time to find out.
  "@sentry/cli": true
  electron: true
  esbuild: true
  # Not pending on every platform, but listed so the decision travels: fsevents is macOS-only,
  # and sharp ships prebuilt binaries for most targets.
  fsevents: true
  sharp: true
  # Reached only through `electron-builder-squirrel-windows`, a peer of `app-builder-lib`.
  # Nothing here builds a Squirrel target — the Windows target is `dir`, see
  # `app/electron-client/electron-builder-config.ts` — so its postinstall has nothing to do.
  electron-winstaller: false
  # Its postinstall runs `vue-demi-switch`, which picks the shim for Vue 2 vs Vue 3. This repo is
  # Vue 3 only, which is what the package already ships by default.
  vue-demi: false
