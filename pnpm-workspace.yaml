catalog:
  # Pinned exactly, and overridden below, so the tree holds one TypeScript: `@marijn/buildtool`
  # (a dev dependency of the Lezer/CodeMirror markdown forks) asks for `^5.3.3` and otherwise keeps
  # whatever the lockfile last resolved. Move `vue-tsc` with it; it type-checks the GUI.
  # Held at 6.0.x: `@typescript-eslint` 8.70 peers `typescript <6.1.0`, so a 6.1 needs it moved too,
  # and 7.0 has no JavaScript API for `vue-tsc`, typed linting or our AST codegen (see #149, #166).
  typescript: 6.0.3
  # Also a peer of `prettier-plugin-organize-imports` at the root, which auto-installs its own copy
  # unless overridden below (unused there: .vue files skip that plugin, see `.prettierrc.yaml`).
  vue-tsc: ^3.3.11
  "@types/node": ^24.2.1
  vite: ^7.3.2
  vitest: ^3.2.4
  vue: ^3.5.43
  # Must move with `vue`: `project-view/composables/backend.ts` augments `RefUnwrapBailTypes`
  # from `@vue/reactivity`, so a second copy would attach the augmentation to types Vue does
  # not use. Catalogued rather than ranged so the two cannot drift apart again.
  "@vue/reactivity": ^3.5.43
  # Pinned exactly (not by range) so `pnpm install` cannot float to a new driver unmeasured:
  # each release bundles a different Chromium, and the integration suite is timing-sensitive.
  # Was held at 1.55.1 (#32) because 1.63.0 made tableVisualisation.spec.ts's `sorting and
  # copying` tests ~3x flakier. The cause was ours, not the driver's: the table's range
  # selection was updated from AG Grid's deferred (setTimeout 0) cell events, so a Mod+C sent
  # right after a Shift+Click could be handled first, and the newer Chromium only widened that
  # window. #136 made the update synchronous; re-measured on both versions before bumping
  # (numbers in #32). To move it: change this line, `pnpm install`, then
  # `pnpm exec playwright install chromium`, and compare full-spec rates on both versions.
  playwright: 1.63.0
  "@codemirror/autocomplete": ^6.20.3
  "@codemirror/language": ^6.12.4
  "@codemirror/state": ^6.7.5
  "@codemirror/view": ^6.43.12
  "@fast-check/vitest": ^0.2.1
  "@lezer/common": ^1.5.2
  "@lezer/highlight": ^1.2.3
  zod: ^3.25.49
  tslib: ^2.8.1
