## Launcher's application.conf

akka {
  loggers = ["akka.event.slf4j.Slf4jLogger"]
  logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"
  stdout-loglevel = "ERROR"
}

logging-service {
  logger {
    akka.actor = info
    akka.event = error
    akka.io = error
    akka.stream = error
  }
  appenders = [
      {
        # Used only with `ENSO_APPENDER_DEFAULT=socket`. No logging server listens
        # on a well-known port (each language server picks a free one), so the
        # port has to be given; without it (0) the launcher logs locally.
        name = "socket"
        hostname = "localhost"
        hostname = ${?ENSO_LOGSERVER_HOSTNAME}
        port = 0
        port = ${?ENSO_LOGSERVER_PORT}
      },
      {
        name = "file",
        pattern = "[%level{lowercase=true}] [%d{yyyy-MM-dd'T'HH:mm:ssXXX}] [%logger] %msg%n"
      },
      {
        name = "console"
        pattern = "[%level{lowercase=true}] [%d{yyyy-MM-dd'T'HH:mm:ssXXX}] [%logger] %msg%n%nopex"
      }
  ]
  default-appender = console
  default-appender = ${?ENSO_APPENDER_DEFAULT}
  log-to-file {
    enable = true
    enable = ${?ENSO_LOG_TO_FILE}
    log-level = info
    log-level = ${?ENSO_LOG_TO_FILE_LOG_LEVEL}
  }
}
