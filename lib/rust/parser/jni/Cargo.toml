[package]
name = "enso-parser-jni"
version = "0.1.0"
authors = ["jdunkerley"]
edition = "2024"
description = "Enso Parser JNI dynamic library."
readme = "README.md"
homepage = "https://github.com/jdunkerley/enso"
repository = "https://github.com/jdunkerley/enso"
license-file = "../../LICENSE"

[dependencies]
enso-prelude = { path = "../../prelude" }
enso-parser = { path = "../" }
jni = "0.21.0"
twox-hash = { workspace = true }

[lib]
name = "enso_parser"
crate-type = ["cdylib"]

[lints]
workspace = true
