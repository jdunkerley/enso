[package]
name = "enso-parser-schema"
version = "0.1.0"
authors = ["jdunkerley"]
edition = "2024"
description = "Generates schema describing Enso Parser AST types."
readme = "README.md"
homepage = "https://github.com/jdunkerley/enso"
repository = "https://github.com/jdunkerley/enso"
license-file = "../../LICENSE"

[dependencies]
enso-metamodel = { path = "../../metamodel" }
enso-parser = { path = ".." }
enso-reflect = { path = "../../reflect" }
serde = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
