[package]
name = "enso-parser-generate-java"
version = "0.1.0"
authors = ["jdunkerley"]
edition = "2024"
description = "Generates Java bindings and deserialization for Enso Parser AST types."
readme = "README.md"
homepage = "https://github.com/jdunkerley/enso"
repository = "https://github.com/jdunkerley/enso"
license-file = "../../LICENSE"

[dependencies]
enso-metamodel = { path = "../../metamodel", features = ["java"] }
enso-prelude = { path = "../../prelude" }
enso-parser = { path = ".." }
enso-reflect = { path = "../../reflect", features = ["graphviz"] }
derive-where = { workspace = true }

[lints]
workspace = true
