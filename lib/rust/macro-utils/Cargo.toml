[package]
name = "enso-macro-utils"
version = "0.2.0"
authors = ["jdunkerley"]
edition = "2024"
description = "Utilities for writing macros."
readme = "README.md"
homepage = "https://github.com/jdunkerley/enso/lib/rust/macro-utils"
repository = "https://github.com/jdunkerley/enso"
license-file = "../../LICENSE"
keywords = ["macro", "utility"]
categories = ["development-tools::procedural-macro-helpers"]
publish = true

[lib]
crate-type = ["rlib"]

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[lints]
workspace = true
