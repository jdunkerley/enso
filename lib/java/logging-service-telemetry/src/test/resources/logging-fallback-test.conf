# Used by LoggingSetupHelperFallbackTest: the logging part of
# `application-ls.conf`, reduced to a log file. The test sets the server's port.
logging-service {
  appenders = [
    {
      name = "socket"
      hostname = "localhost"
      port = 0
    },
    {
      name = "console"
    }
  ]
  default-appender = socket
  server {
    start = true
    port = 0
    log-to-file {
      enable = true
      log-level = trace
    }
    appenders = [
      {
        name = "file"
        immediate-flush = true
      },
      {
        name = "console"
      }
    ]
    default-appender = console
  }
}
