# Options intended to be common for all developers.

wasm-size-limit: 16.20 MiB

# The most recent stable Enso release.
#
# A build that is not given an explicit `ENSO_VERSION` derives its own `<next stable>-dev` version
# from this. Keeping it here rather than reading the repository's tags means a local build needs no
# network access. Must be updated by the release process whenever a stable release is published; a
# stale value only misnames local dev builds, it does not affect a release build (which always sets
# `ENSO_VERSION` explicitly).
latest-release: 2025.3.4

required-versions:
  # NB. The Rust version is pinned in rust-toolchain.toml.
  # NB. The Node version is pinned in .node-version.
  # We no longer need cargo-watch: ^8.1.1

# The JVM toolchain that CI's `.github/actions/setup-jvm` installs. The build keeps its own copies,
# and `tools/ci/check-workflows.mjs` fails if these drift from them:
# - graalvm: `graalVersion` in `project/Dependencies.scala` (sbt refuses any other JDK);
# - sbt: `sbt.version` in `project/build.properties` (HELD there, see its note);
# - flatc: `flatbuffersVersion` in `project/Dependencies.scala` (checked when the language server
#   compiles).
# One flat `key: value` per line: `setup-jvm` reads them with awk.
toolchain:
  graalvm: 25.0.1
  sbt: 1.10.6
  flatc: 24.3.25
