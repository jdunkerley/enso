    repository: bundled
    version: {{LIBS_VERSION}}
  - name: Standard.AWS
    repository: bundled
    version: {{LIBS_VERSION}}
  - name: Standard.Geo
    repository: bundled
    version: {{LIBS_VERSION}}
  - name: Standard.Visualization
    repository: bundled
    version: {{LIBS_VERSION}}
  - name: Standard.Examples
