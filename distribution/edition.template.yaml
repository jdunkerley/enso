# This file is a template and should not be used directly.
# The processing replaces placeholders in double brackets with actual values.
#
# Every standard library listed here is bundled with the engine (`lib/Standard`
# of the distribution), and the engine looks bundled libraries up before it
# consults any repository. This fork runs no library repository, so the
# `bundled` repository below is a placeholder that points at no archive: a
# library that is not bundled fails with "library not found" instead of being
# downloaded from the network. The `edition-providers` of the global
# configuration is empty by default for the same reason.

engine-version: {{ENGINE_VERSION}}
repositories:
  - name: bundled
    url: 'jar:file:///enso-no-library-repository.zip!/'

libraries:
  - name: Standard.Base
    repository: bundled
    version: {{LIBS_VERSION}}
  - name: Standard.Test
    repository: bundled
    version: {{LIBS_VERSION}}
  - name: Standard.Table
    repository: bundled
    version: {{LIBS_VERSION}}
