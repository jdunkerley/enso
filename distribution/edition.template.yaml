# This file is a template and should not be used directly.
# The processing replaces placeholders in double brackets with actual values.
#
# See [Libraries-Editions](https://github.com/jdunkerley/enso/wiki/Libraries-Editions)
# for the description of its contents.
#
# === Library upload ===
# Some libraries may be uploaded during the (nightly) release.
# Such libraries need to have an associated repository with URL with `jar` scheme.
# See [Libraries-Sharing](https://github.com/jdunkerley/enso/wiki/Libraries-Sharing)
#
# The `release` repository is this fork's GitHub release. The release workflow
# does not publish the zip yet; libraries that are not bundled with the engine
# will be resolved from it.
#

engine-version: {{ENGINE_VERSION}}
repositories:
  - name: release
    url: 'jar:https://github.com/jdunkerley/enso/releases/download/{{ENGINE_VERSION}}/std_image_repo.zip!/'

libraries:
