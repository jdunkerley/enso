[workspace]
resolver = "2"
members = [
	"app/rust-ffi",
	"build_tools/ci-gen",
	"build_tools/cli",
	"build_tools/install",
	"build_tools/install/config",
	"build_tools/install/installer",
	"build_tools/install/uninstaller",
	"build_tools/macros/lib",
	"lib/rust/launcher-shims",
	"lib/rust/macro-utils",
	"lib/rust/metamodel",
	"lib/rust/parser/debug",
	"lib/rust/parser/debug/fuzz",
	"lib/rust/parser/generate-java",
	"lib/rust/parser/jni",
	"lib/rust/parser/macros",
	"lib/rust/parser/schema",
	"lib/rust/parser/src/syntax/tree/visitor",
	"lib/rust/prelude",
	"lib/rust/prelude/macros",
	"lib/rust/reflect",
	"lib/rust/zst",
]

[workspace.dependencies]
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# !!!!!!!!!! WARNING !!!!!!!!!!
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# We are tryingto maintain minimum set of dependencies. Before adding a new dependency, consult it
# with the core development team. Thank you!
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = [
	"derive",
	"env",
	"wrap_help",
	"string",
] }
derive-where = "1.7.0"
dirs = { version = "7.0.0" }
flate2 = { version = "1.1.10" }
indicatif = { version = "0.17.7", features = ["tokio"] }
mime = "0.3.17"
new_mime_guess = "4.0.4"
multimap = { version = "0.9.1" }
native-windows-gui = { version = "1.0.13" }
octocrab = { git = "https://github.com/enso-org/octocrab", default-features = false, features = [
	"rustls",
] }
path-absolutize = "3.1.1"
portpicker = { version = "0.1.1" }
regex = { version = "1.13.1" }
serde = { version = "1.0.229", features = ["derive", "rc"] }
# `serde_yaml` is unmaintained — its last release is literally `0.9.34+deprecated`. `serde_norway`
# continues the 0.9 line, so it is a drop-in for the API used here. It is aliased to the old name
# so the existing `serde_yaml::` paths keep working; the package being pulled is what this line
# says, not the alias.
serde_yaml = { package = "serde_norway", version = "0.9.42" }
sha2 = { version = "0.10.8" }
sysinfo = { version = "0.39.6" }
tar = { version = "0.4.46" }
# Note [Held Back By The octocrab Fork]
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# `tokio` 1.44+, `tokio-util` 0.7.14+ and `bytes` 1.2+ cannot be resolved while the `octocrab`
# git dependency below stays on the `enso-org` fork: it pulls `hyperx 1.4`, which requires
# `bytes >=1.0.0, <1.2.0`, and `tokio` 1.44 needs `bytes ^1.2.1`. These three are therefore at
# the newest versions that resolve, not the newest that exist. Dropping the fork unblocks all
# three at once — see the `octocrab` note in enso#24.
#
# The cap also reaches transitive crates that cargo cannot see it through: `combine` 4.6.8
# declares `bytes ^1` but calls `BytesMut::spare_capacity_mut`, which `bytes` only grew in 1.2,
# so the resolver picks a combination that does not compile. `combine` is held at 4.6.7 in
# `Cargo.lock`; it is not a direct dependency, so the lockfile is the only place that can
# express it. A `cargo update` that lets `combine` float again succeeds — resolution is where
# the bad pairing is chosen, not where it is detected — and the next `cargo check` or build
# then fails with `no method named spare_capacity_mut`. If you hit that, this is why: re-pin
# with `cargo update combine --precise 4.6.7`.
tokio = { version = "1.43.4", features = ["full", "tracing"] }
tokio-stream = { version = "0.1.19", features = ["fs"] }
tokio-util = { version = "0.7.13", features = ["full"] }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = { version = "2.5.0" }
windows = { version = "0.62.2", features = [
	"Win32_UI",
	"Win32_UI_Shell",
	"Win32_System_LibraryLoader",
	"Win32_System_Com",
] }
winreg = { version = "0.56.0" }
anyhow = { version = "1.0.104" }
derive_more = { version = "2.1.1", features = [
	"index",
	"index_mut",
	"deref",
	"deref_mut",
	"display",
	"from",
	"into",
	"as_ref",
	"add",
	"add_assign",
] }
boolinator = { version = "2.4.0" }
futures = { version = "0.3.34", default-features = false, features = [
	"std",
	"executor",
] }
futures-util = { version = "0.3.34", default-features = false }
itertools = { version = "0.12.1" }
lazy_static = { version = "1.5.0" }
serde_json = { version = "1.0.151", features = ["raw_value"] }
owned_ttf_parser = { version = "0.15.1" }
convert_case = { version = "0.6.0" }
# Held at 1.1 — see Note [Held Back By The octocrab Fork] above.
bytes = { version = "1.1.0" }
console_error_panic_hook = { version = "0.1.7" }
reqwest = { version = "0.11.27", default-features = false, features = [
	"rustls-tls",
	"stream",
] }
proc-macro2 = { version = "1.0.107" }
syn = { version = "3.0.6", features = [
	"full",
	"extra-traits",
	"printing",
	"parsing",
	"visit",
	"visit-mut",
] }
quote = { version = "1.0.47" }
semver = { version = "1.0.28", features = ["serde"] }
strum = { version = "0.28.0", features = ["derive"] }

[workspace.lints]
[workspace.lints.rust]
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "deny"
unsafe_code = "warn"
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
# This is fine, since we plan to use our traits only in our own code and
# potential ABI breaking changes are not a concern.
async_fn_in_trait = "allow"

[workspace.lints.clippy]
bool_to_int_with_if = "allow"
let_and_return = "allow"

[profile.dev]
opt-level = 1
lto = false
debug = true
debug-assertions = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
incremental = true
debug = false
debug-assertions = false

[profile.fuzz]
inherits = "release"
debug-assertions = true
overflow-checks = true

[profile.bench]
opt-level = 3
lto = true
debug = false
debug-assertions = false

[profile.test]
opt-level = 0
lto = false
debug = 2
debug-assertions = true
