[workspace]
resolver = "2"
members = [
	"app/rust-ffi",
	"lib/rust/macro-utils",
	"lib/rust/metamodel",
	"lib/rust/parser/debug",
	"lib/rust/parser/debug/fuzz",
	"lib/rust/parser/generate-java",
	"lib/rust/parser/jni",
	"lib/rust/parser/macros",
	"lib/rust/parser/schema",
	"lib/rust/parser/src/syntax/tree/visitor",
	"lib/rust/prelude",
	"lib/rust/prelude/macros",
	"lib/rust/reflect",
	"lib/rust/zst",
]

[workspace.dependencies]
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# !!!!!!!!!! WARNING !!!!!!!!!!
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# We are trying to maintain a minimum set of dependencies. Before adding a new dependency, consult
# the core development team. Thank you!
boolinator = { version = "2.4.0" }
clap = { version = "4.6.7", features = [
	"derive",
	"env",
	"wrap_help",
	"string",
] }
console_error_panic_hook = { version = "0.1.7" }
convert_case = { version = "0.12.0" }
derive-where = "1.7.0"
derive_more = { version = "2.1.1", features = [
	"index",
	"index_mut",
	"deref",
	"deref_mut",
	"display",
	"from",
	"into",
	"as_ref",
	"add",
	"add_assign",
] }
proc-macro2 = { version = "1.0.107" }
quote = { version = "1.0.47" }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
syn = { version = "3.0.6", features = [
	"full",
	"extra-traits",
	"printing",
	"parsing",
	"visit",
	"visit-mut",
] }

[workspace.lints]
[workspace.lints.rust]
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "deny"
unsafe_code = "warn"
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
# This is fine, since we plan to use our traits only in our own code and
# potential ABI breaking changes are not a concern.
async_fn_in_trait = "allow"

[workspace.lints.clippy]
bool_to_int_with_if = "allow"
let_and_return = "allow"

[profile.dev]
opt-level = 1
lto = false
debug = true
debug-assertions = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
incremental = true
debug = false
debug-assertions = false

[profile.fuzz]
inherits = "release"
debug-assertions = true
overflow-checks = true

[profile.bench]
opt-level = 3
lto = true
debug = false
debug-assertions = false

[profile.test]
opt-level = 0
lto = false
debug = 2
debug-assertions = true
