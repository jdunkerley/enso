# This file is not auto-generated. Feel free to edit it.

name: IDE Changed Files

on:
  workflow_call:
    outputs:
      all_changed_files:
        description: "Returns all changed files"
        value: ${{ jobs.ide-changed-files.outputs.all_changed_files }}
      any_changed:
        description: "Returns `true` when any of the filenames have changed"
        value: ${{ jobs.ide-changed-files.outputs.any_changed }}

# The build and packaging plumbing of the IDE: the build script (`./run`, `build_tools/`), the
# toolchains, the dependency manifests and the workflows. GUI sources are covered by
# `gui-changed-files.yml` and the bundled engine by `engine-changed-files.yml`. Markdown is ignored:
# nothing on this list reads a `.md` file while building or packaging the IDE.
jobs:
  ide-changed-files:
    runs-on: ubuntu-latest
    name: Changed Files
    outputs:
      all_changed_files: ${{ steps.ide-changed-files.outputs.all_changed_files }}
      any_changed: ${{ steps.ide-changed-files.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Get changed files
        id: ide-changed-files
        uses: step-security/changed-files@v45
        with:
          files: |
            app/electron-client/**
            build_tools/**
            .cargo/**
            Cargo.lock
            Cargo.toml
            rust-toolchain.toml
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            .npmrc
            .pnpmfile.cjs
            .node-version
            tsconfig.json
            build-config.yaml
            build.sbt
            .jvmopts
            git-clean.mjs
            run
            run.cmd
            run.ps1
            .github/**
          files_ignore: |
            **/*.md
      - name: List all changed files
        env:
          ALL_CHANGED_FILES: ${{ steps.ide-changed-files.outputs.all_changed_files }}
        run: |
          if [[ "${{ steps.ide-changed-files.outputs.any_changed }}" == "true" ]]; then
            echo "Files changed:"
          fi
          for file in ${ALL_CHANGED_FILES}; do
            echo "$file"
          done
