name: Changelog
on:
  pull_request:
    types:
      - labeled
      - unlabeled
      - synchronize
      - opened
      - reopened
jobs:
  build-script-linux-amd64:
    name: Build Script
    runs-on:
      - ubuntu-latest
    steps:
      - name: Checking out the repository
        uses: actions/checkout@v4
        with:
          clean: false
      - name: Compile
        run: cargo build -p enso-build-cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: enso-build-cli-${{ runner.os }}
          path: target/rust/debug/enso-build-cli
          retention-days: 1
  changelog:
    name: Changelog
    needs:
      - build-script-linux-amd64
    runs-on:
      - ubuntu-latest
    steps:
      - name: Expose Artifact API and context information.
        uses: actions/github-script@v7
        with:
          script: "\n    core.exportVariable(\"ACTIONS_RUNTIME_TOKEN\", process.env[\"ACTIONS_RUNTIME_TOKEN\"])\n    core.exportVariable(\"ACTIONS_RUNTIME_URL\", process.env[\"ACTIONS_RUNTIME_URL\"])\n    core.exportVariable(\"GITHUB_RETENTION_DAYS\", process.env[\"GITHUB_RETENTION_DAYS\"])\n    console.log(context)\n    "
      - name: Checking out the repository
        uses: actions/checkout@v4
        with:
          clean: false
      - if: runner.os == 'macOS'
        name: Setup nodejs version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - if: runner.os != 'Linux'
        run: npm install -g --force corepack@0.36.0 && corepack --version
      - name: Download Build Script
        uses: actions/download-artifact@v4
        with:
          name: enso-build-cli-${{ runner.os }}
          path: ${{ runner.temp }}/enso-build-cli
      - name: Configure Build Script
        run: |-
          BIN="$RUNNER_TEMP/enso-build-cli/enso-build-cli"
          [ "$RUNNER_OS" = "Windows" ] && BIN="$BIN.exe"
          chmod +x "$BIN" || true
          echo "ENSO_BUILD_CLI_BIN=$BIN" >> "$GITHUB_ENV"
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Script Setup
        run: ./run --help
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: "${{ (contains(github.event.pull_request.labels.*.name, 'CI: Clean build required') || (github.ref == 'refs/heads/develop') || inputs.clean_build_required) }}"
        name: Clean before
        run: corepack pnpm run git-clean --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: ./run changelog-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: "${{ (always()) && (contains(github.event.pull_request.labels.*.name, 'CI: Clean build required') || (github.ref == 'refs/heads/develop') || inputs.clean_build_required) }}"
        name: Clean after
        run: corepack pnpm run git-clean --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
env:
  ENSO_BUILD_SKIP_VERSION_CHECK: "true"
