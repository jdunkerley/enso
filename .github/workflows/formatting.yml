name: Code Formatting Check

on:
  push:
    branches: [develop]
  pull_request:
    # Specs and plans alone start no checks; every `pull_request` workflow ignores them
    # (`tools/ci/check-workflows.mjs` checks it).
    paths-ignore:
      - "docs/superpowers/**"
    branches: ["*"]

jobs:
  test_formatting:
    name: Test Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # No need to run it on multiple distros, result should be the same
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      # GraalVM and sbt at the versions pinned in `build-config.yaml` (`toolchain:`).
      - name: Set up the JVM toolchain
        uses: ./.github/actions/setup-jvm
        with:
          cache-key: engine
          cache-save: "false"
      - name: Check Code Formatting
        run: |
          sbt "scalafmtCheckAll; javafmtCheckAll; scalafmtSbtCheck"
