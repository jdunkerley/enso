# This file is not auto-generated. Feel free to edit it.

name: Engine Changed Files

on:
  workflow_call:
    outputs:
      all_changed_files:
        description: "Returns all changed files, deleted ones included"
        value: ${{ jobs.engine-changed-files.outputs.all_changed_files }}
      touched_files:
        description: "Every touched path, space-separated: added, copied, modified and deleted files, and a renamed file under both its old and new path"
        value: ${{ jobs.engine-changed-files.outputs.touched_files }}
      any_changed:
        description: "Returns `true` when any of the filenames have changed or been deleted"
        value: ${{ jobs.engine-changed-files.outputs.any_changed }}

permissions:
  contents: read

jobs:
  engine-changed-files:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Changed Files
    outputs:
      all_changed_files: ${{ steps.engine-changed-files.outputs.all_modified_files }}
      touched_files: ${{ steps.engine-changed-files.outputs.all_changed_and_modified_files }}
      any_changed: ${{ steps.engine-changed-files.outputs.any_modified }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Get changed files
        id: engine-changed-files
        uses: step-security/changed-files@v45
        with:
          # A rename is reported as a deletion of the old path plus an addition of the new one, so
          # `all_changed_and_modified_files` (ACMRDTUX: the `touched_files` output) holds both. The
          # standard library test selection needs every path a pull request touched. The gate
          # itself reads `any_modified` and `all_modified_files` (ACMRD), not `any_changed` and
          # `all_changed_files` (ACMR): a pull request that only deletes files must start the checks.
          output_renamed_files_as_deleted_and_added: true
          # The list also bounds the standard library test selection: a path outside it never
          # reaches it. It holds the helpers the tests start: the standard library suites run
          # `tools/http-test-helper`, the JVM tests `tools/simple-library-server`. (No comments
          # inside `files:`: a block scalar would pass them on as patterns.)
          files: |
            distribution/**
            engine/**
            lib/**
            project/**
            std-bits/**
            test/**
            build.sbt
            build-config.yaml
            tools/build-scripts/**
            tools/http-test-helper/**
            tools/simple-library-server/**
            .cargo/**
            Cargo.lock
            Cargo.toml
            rust-toolchain.toml
            .github/workflows/engine-changed-files.yml
            .github/workflows/engine-checks-platform.yml
            .github/actions/**
            .github/workflows/engine-checks.yml
            .github/workflows/engine-pull-request.yml
          # Agent notes are never read by the build or the tests. Those under `distribution/` are
          # deliberately NOT ignored: they ship with the standard library, and the IDE's assistant
          # reads them at run time.
          files_ignore: |
            engine/**/CLAUDE.md
            lib/**/CLAUDE.md
            project/**/CLAUDE.md
            std-bits/**/CLAUDE.md
            test/**/CLAUDE.md
      - name: List all changed files
        env:
          ALL_CHANGED_FILES: ${{ steps.engine-changed-files.outputs.all_modified_files }}
        run: |
          if [[ "${{ steps.engine-changed-files.outputs.any_modified }}" == "true" ]]; then
            echo "Files changed:"
          fi
          for file in ${ALL_CHANGED_FILES}; do
            echo "$file"
          done
