# Hand-written. One platform's engine checks: the engine distribution, then the tests and checks
# that use it. `engine-checks.yml` calls it once per platform; `engine-checks-nightly.yml` also for
# macOS and for Oracle GraalVM, `macos-checks.yml` for the self-hosted Mac, and
# `extra-nightly-tests.yml` for the distribution alone. It has no `concurrency:` of its own: the
# platforms' calls would share the group and cancel each other.

name: Engine Checks (platform)
on:
  workflow_call:
    inputs:
      os:
        description: "`linux`, `windows` or `macos`: names the jobs and artifacts; `linux` adds the Linux-only checks and the databases."
        required: true
        type: string
      arch:
        description: "`amd64`, or `aarch64` for the self-hosted Mac: names the jobs and artifacts."
        required: false
        type: string
        default: amd64
      runner:
        description: >-
          The runner for every job: a label (`ubuntu-latest`), or a JSON list of labels
          (`["self-hosted", "macOS"]`).
        required: true
        type: string
      edition:
        description: "`GraalVM CE` or `Oracle GraalVM`: the JDK every job builds and runs with; part of the names."
        required: false
        type: string
        default: GraalVM CE
      jvm-tests:
        description: Run the JVM tests.
        required: false
        type: boolean
        default: true
      linux-checks:
        description: On Linux, also run the Enso lint and the Standard Library API check.
        required: false
        type: boolean
        default: true
      stdlib-suites:
        description: >-
          JSON list of the Standard Library test suites to run, each `{"suite": "<stdlib-test
          suite>", "title": "<job title>", "small-jdk": <bool>, "postgres": <bool>, "mssql":
          <bool>}`: the JVM suite needs the small JDK (not built for Oracle GraalVM, which
          `stdlib-test` runs without it); `postgres` and `mssql` (Linux only) start that database for
          the suite. `[]` runs none.
        required: true
        type: string
      clean_build_required:
        description: Clean before and after each job.
        required: false
        type: boolean
        default: false
    outputs:
      ENSO_VERSION:
        description: The engine distribution's version, for a caller's own jobs that download it.
        value: ${{ jobs.build-engine-distribution.outputs.ENSO_VERSION }}
      ENSO_EDITION:
        description: The engine distribution's edition.
        value: ${{ jobs.build-engine-distribution.outputs.ENSO_EDITION }}
      ENSO_RELEASE_MODE:
        description: Whether the distribution was built in release mode.
        value: ${{ jobs.build-engine-distribution.outputs.ENSO_RELEASE_MODE }}

env:
  # Read by `.github/actions/git-clean`.
  ENSO_CI_CLEAN_BUILD: "${{ contains(github.event.pull_request.labels.*.name, 'CI: Clean build required') || github.ref == 'refs/heads/develop' || inputs.clean_build_required }}"

jobs:
  # Note [The Engine Distribution Build]
  # ====================================
  # The retired build CLI's `backend ci-build-engine-distribution` is the sbt task
  # `ciBuildEngineDistribution` (Note [CI Engine Distribution Build] in build.sbt), called as the
  # retired build CLI called sbt: `LC_ALL=C.UTF-8 SBT_SERVER_FORCESTART=true sbt
  # -Dbench.compileOnly=false -Dsbt.server.autostart=false "clean; all ciBuildEngineDistribution"`
  # (`all` because a hosted runner has more memory than the retired build CLI's single-batch
  # threshold). The version comes from `tools/build-scripts` (`version`); its step keeps `id:
  # build`, so the job's outputs are what they were, and it exports the version to the later steps,
  # which is how sbt names the package. `ENSO_LAUNCHER` stays `native,test`, the value the retired
  # build CLI forced. `setup-msvc` replaces the retired build CLI's MSVC environment on Windows: the
  # native images link with it, and the runtime DLL copy reads `VCToolsRedistDir`. The build
  # compiles the Rust parser with several `cargo` calls at once, so `setup-jvm` installs the Rust
  # toolchain first (`rust`; Note [Install The Rust Toolchain Before sbt] in
  # `.github/actions/setup-jvm`). Gone from this job, because only the retired build CLI read them
  # here or nothing did: GraalPy, `GRAAL_EDITION`, `GITHUB_TOKEN` and the `GITHUB_ENV` copy of
  # `ENSO_TEST_JUNIT_DIR`. (The standard library jobs still use GraalPy and `GRAAL_EDITION`.)
  build-engine-distribution:
    name: Build Engine Distribution (${{ inputs.edition }}) (native,test) (${{ inputs.os }}, ${{ inputs.arch }})
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    env:
      ENSO_LAUNCHER: native,test
    # The distribution's version, for the jobs that use it. See Note [Lint Reads The Distribution's
    # Version].
    outputs:
      ENSO_VERSION: ${{ steps.build.outputs.ENSO_VERSION }}
      ENSO_EDITION: ${{ steps.build.outputs.ENSO_EDITION }}
      ENSO_RELEASE_MODE: ${{ steps.build.outputs.ENSO_RELEASE_MODE }}
    steps:
      - name: Checking out the repository
        uses: actions/checkout@v5
        with:
          clean: false
      - uses: ./.github/actions/setup-node
      - name: Clean before
        uses: ./.github/actions/git-clean
      - name: Set up the build scripts
        uses: ./.github/actions/setup-build-scripts
      - name: Set up the JVM toolchain
        uses: ./.github/actions/setup-jvm
        with:
          cache-key: engine
          edition: ${{ inputs.edition == 'Oracle GraalVM' && 'oracle' || 'community' }}
          flatc: "true"
          rust: "true"
      - name: Set up MSVC
        uses: ./.github/actions/setup-msvc
      - id: build
        name: Compute the version
        run: corepack pnpm --filter build-scripts run version
      - name: Build the engine distribution
        run: sbt "-Dbench.compileOnly=false" "-Dsbt.server.autostart=false" "clean; all ciBuildEngineDistribution"
        env:
          LC_ALL: C.UTF-8
          SBT_SERVER_FORCESTART: "true"
      - name: Archive Engine Distribution
        run: tar -cvf built-distribution.tar built-distribution test
      - name: Upload Engine Distribution
        uses: actions/upload-artifact@v5
        with:
          name: Engine Distribution (${{ inputs.edition }}) (native,test) (${{ inputs.os }}, ${{ inputs.arch }})
          path: built-distribution.tar
      - name: Cleanup Archive
        run: rm built-distribution.tar
      - name: Clean after
        if: always()
        uses: ./.github/actions/git-clean

  # Note [Lint Reads The Distribution's Version]
  # =============================================
  # `lintEnso` lints the distribution at `engineDistributionRoot`, which sbt names from
  # `ENSO_VERSION` (`built-distribution/enso-engine-<version>-<os>-<arch>/enso-<version>`), and
  # sbt's default is 0.0.0-dev. On CI (`CI` set) `lintEnso` does not build the distribution
  # (Note [lintEnso Builds The Distribution Only Locally] in build.sbt), so the lint job lints the
  # downloaded one at that versioned path. The build job computed the version (`<next stable>-dev`)
  # and published it as its outputs, so the lint step takes it from there rather than computing its
  # own, which keeps the path identical to the build job's. Otherwise the step
  # runs what the retired build CLI's `libraries lint` ran once it had provisioned GraalVM and sbt:
  # `sbt -Dbench.compileOnly=false -Dsbt.server.autostart=false "all lintEnso"`, with
  # `LC_ALL=C.UTF-8` and `SBT_SERVER_FORCESTART=true` (`all` because a hosted runner has more memory
  # than the retired build CLI's single-batch threshold; for one task it changes nothing). With no
  # build the job needs no flatc. Nothing in sbt or the engine reads
  # `GITHUB_TOKEN`, so the step does not pass it. The syntax check (`checkEnsoSyntax`, which
  # replaced the retired build CLI's `libraries check-syntax`) runs the Rust parser's `check_syntax`
  # through cargo, so `setup-jvm` installs the Rust toolchain (`rust`) first: today that one cargo
  # call runs before `all lintEnso` and would install it alone, but tasks run in parallel under
  # `all` would race (Note [Install The Rust Toolchain Before sbt] in `.github/actions/setup-jvm`).
  enso-code-lint:
    name: Enso Code Lint (linux, amd64)
    if: inputs.os == 'linux' && inputs.linux-checks
    needs: [build-engine-distribution]
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    env:
      ENSO_LINT_ENABLE_GITHUB_ANNOTATIONS: "true"
    steps:
      - name: Checking out the repository
        uses: actions/checkout@v5
        with:
          clean: false
      - uses: ./.github/actions/setup-node
      - name: Clean before
        uses: ./.github/actions/git-clean
      - name: Set up the JVM toolchain
        uses: ./.github/actions/setup-jvm
        with:
          cache-key: engine
          edition: ${{ inputs.edition == 'Oracle GraalVM' && 'oracle' || 'community' }}
          rust: "true"
      - name: Check syntax
        run: sbt "-Dsbt.server.autostart=false" checkEnsoSyntax
        env:
          LC_ALL: C.UTF-8
          SBT_SERVER_FORCESTART: "true"
      - name: Download the engine distribution
        uses: ./.github/actions/download-engine-distribution
        with:
          name: Engine Distribution (${{ inputs.edition }}) (native,test) (${{ inputs.os }}, ${{ inputs.arch }})
      - name: Check the distribution's version
        run: |-
          if [ -z "$ENSO_VERSION" ]; then
            echo "::error::build-engine-distribution published no ENSO_VERSION."
            exit 1
          fi
          ls -d built-distribution/enso-engine-"$ENSO_VERSION"-*/enso-"$ENSO_VERSION"
        env:
          ENSO_VERSION: ${{ needs.build-engine-distribution.outputs.ENSO_VERSION }}
      - name: Lint
        run: sbt "-Dbench.compileOnly=false" "-Dsbt.server.autostart=false" "all lintEnso"
        env:
          ENSO_VERSION: ${{ needs.build-engine-distribution.outputs.ENSO_VERSION }}
          ENSO_EDITION: ${{ needs.build-engine-distribution.outputs.ENSO_EDITION }}
          ENSO_RELEASE_MODE: ${{ needs.build-engine-distribution.outputs.ENSO_RELEASE_MODE }}
          LC_ALL: C.UTF-8
          SBT_SERVER_FORCESTART: "true"
      - name: Clean after
        if: always()
        uses: ./.github/actions/git-clean

  # Note [The JVM Test Steps]
  # =========================
  # The steps are what the retired build CLI's `backend test jvm` ran (its `context.rs`), in its
  # order, each sbt call as the retired build CLI made it (`LC_ALL=C.UTF-8
  # SBT_SERVER_FORCESTART=true sbt -Dbench.compileOnly=<…> -Dsbt.server.autostart=false "<tasks>"`),
  # at the build job's version, from which sbt names the downloaded distribution. Its traps, kept on
  # purpose:
  # - `ENSO_TEST_JUNIT_DIR` is set on the `sbt test` step only. The retired build CLI removed it for
  #   the benchmark step, and an empty value is not "unset": ScalaTest would get `-u ""`.
  # - `CI_TEST_TIMEFACTOR=2` and `CI_TEST_FLAKY_ENABLE=true` are written to `GITHUB_ENV` on Windows
  #   only, so that on Linux they are absent rather than empty: an empty time factor breaks the
  #   language server's test configuration, and `FlakySpec` only asks whether the variable exists.
  # - A failing `sbt test` does not stop the parser self-tests or the benchmark step: the retired
  #   build CLI deferred that failure. A failure of any other step stops the job, as it stopped the
  #   retired build CLI.
  # - Two things the retired build CLI appeared to do never took effect, and are not added: the Enso
  #   benchmark dry run (it only runs with Enso benchmarks; `test jvm` asked for the runtime ones)
  #   and the heap-dump `JAVA_TOOL_OPTIONS` (the retired build CLI passed them to the
  #   standard-library tests only).
  # - `setup-jvm` installs the Rust toolchain (`rust`) before the first sbt call: sbt starts
  #   several `cargo` calls at once (Note [Install The Rust Toolchain Before sbt] in
  #   `.github/actions/setup-jvm`).
  jvm-tests:
    name: JVM Tests (${{ inputs.edition }}) (${{ inputs.os }}, ${{ inputs.arch }})
    if: inputs.jvm-tests
    needs: [build-engine-distribution]
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    permissions:
      checks: write
    steps:
      - name: Checking out the repository
        uses: actions/checkout@v5
        with:
          clean: false
      - uses: ./.github/actions/setup-node
      - name: Clean before
        uses: ./.github/actions/git-clean
      - name: Download the engine distribution
        uses: ./.github/actions/download-engine-distribution
        with:
          name: Engine Distribution (${{ inputs.edition }}) (native,test) (${{ inputs.os }}, ${{ inputs.arch }})
      - name: Set up the JVM toolchain
        uses: ./.github/actions/setup-jvm
        with:
          cache-key: engine
          edition: ${{ inputs.edition == 'Oracle GraalVM' && 'oracle' || 'community' }}
          flatc: "true"
          rust: "true"
      # `sbt test` builds native images on Windows too (os-environment's tests).
      - name: Set up MSVC
        uses: ./.github/actions/setup-msvc
      - if: runner.os == 'Windows'
        name: Windows test settings
        shell: pwsh
        run: |-
          "CI_TEST_TIMEFACTOR=2" >> $env:GITHUB_ENV
          "CI_TEST_FLAKY_ENABLE=true" >> $env:GITHUB_ENV
      - name: Install the library server's dependencies
        working-directory: tools/simple-library-server
        run: corepack pnpm install
      - name: Resolve the parser's Java class path
        run: sbt "-Dsbt.server.autostart=false" "syntax-rust-definition/Runtime/managedClasspath"
        env:
          ENSO_VERSION: ${{ needs.build-engine-distribution.outputs.ENSO_VERSION }}
          ENSO_EDITION: ${{ needs.build-engine-distribution.outputs.ENSO_EDITION }}
          ENSO_RELEASE_MODE: ${{ needs.build-engine-distribution.outputs.ENSO_RELEASE_MODE }}
          LC_ALL: C.UTF-8
          SBT_SERVER_FORCESTART: "true"
      - name: Generate the parser's Java sources
        shell: bash
        run: |-
          # The retired build CLI reset the JUnit directory before the tests; stale reports would be
          # published.
          rm -rf target/test-results
          rm -rf target/generated-java/org/enso/syntax2
          mkdir -p target/generated-java/org/enso/syntax2
          cargo run --package enso-parser-generate-java --bin enso-parser-generate-java -- target/generated-java/org/enso/syntax2
      - if: runner.os == 'Linux'
        name: Build the ydoc native image
        run: sbt "-Dbench.compileOnly=true" "-Dsbt.server.autostart=false" "all ydoc-server/buildNativeImage"
        env:
          ENSO_VERSION: ${{ needs.build-engine-distribution.outputs.ENSO_VERSION }}
          ENSO_EDITION: ${{ needs.build-engine-distribution.outputs.ENSO_EDITION }}
          ENSO_RELEASE_MODE: ${{ needs.build-engine-distribution.outputs.ENSO_RELEASE_MODE }}
          LC_ALL: C.UTF-8
          SBT_SERVER_FORCESTART: "true"
      - id: tests
        name: JVM tests
        run: sbt "-Dbench.compileOnly=true" "-Dsbt.server.autostart=false" "set Global / parallelExecution := false; test"
        env:
          ENSO_VERSION: ${{ needs.build-engine-distribution.outputs.ENSO_VERSION }}
          ENSO_EDITION: ${{ needs.build-engine-distribution.outputs.ENSO_EDITION }}
          ENSO_RELEASE_MODE: ${{ needs.build-engine-distribution.outputs.ENSO_RELEASE_MODE }}
          ENSO_TEST_JUNIT_DIR: ${{ github.workspace }}/target/test-results
          LC_ALL: C.UTF-8
          SBT_SERVER_FORCESTART: "true"
      - id: parser-self-tests
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        name: Parser self-tests
        shell: bash
        env:
          # Git Bash would otherwise rewrite the `;`-separated class path on Windows.
          MSYS_NO_PATHCONV: "1"
        run: |-
          gen=target/generated-java
          pkg=$gen/org/enso/syntax2
          cargo run --package enso-parser-generate-java --bin java-tests > "$pkg/GeneratedFormatTests.java"
          sep=:
          if [ "$RUNNER_OS" = "Windows" ]; then sep=';'; fi
          deps=$(tr -d '\r\n' < lib/rust/parser/target/streams/runtime/managedClasspath/_global/streams/export)
          javac --class-path "lib/rust/parser/generate-java/java$sep$gen$sep$deps" -d "$gen" "$pkg/GeneratedFormatTests.java"
          java --class-path "$gen" org.enso.syntax2.GeneratedFormatTests
      - if: ${{ runner.os == 'Linux' && !cancelled() && steps.parser-self-tests.outcome == 'success' }}
        name: Compile the benchmarks, and run the runtime ones once
        run: sbt "-Dbench.compileOnly=true" "-Dsbt.server.autostart=false" "all runtime-benchmarks/compile language-server/Benchmark/compile searcher/Benchmark/compile std-benchmarks/compile; runtime-benchmarks/bench"
        env:
          ENSO_VERSION: ${{ needs.build-engine-distribution.outputs.ENSO_VERSION }}
          ENSO_EDITION: ${{ needs.build-engine-distribution.outputs.ENSO_EDITION }}
          ENSO_RELEASE_MODE: ${{ needs.build-engine-distribution.outputs.ENSO_RELEASE_MODE }}
          LC_ALL: C.UTF-8
          SBT_SERVER_FORCESTART: "true"
      - if: (success() || failure()) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        name: Upload Heap Dumps
        uses: actions/upload-artifact@v5
        with:
          if-no-files-found: ignore
          name: Heap dumps (JVM Tests, ${{ inputs.os }}, ${{ inputs.arch }})
          path: |-
            test/**/*.hprof
            engine/**/*.hprof
          retention-days: 3
      - if: (success() || failure()) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        name: Engine Test Reporter
        uses: dorny/test-reporter@v1
        with:
          max-annotations: 50
          name: Engine Tests Report (${{ inputs.edition }}, ${{ inputs.os }}, ${{ inputs.arch }})
          path: target/test-results/*.xml
          path-replace-backslashes: true
          reporter: java-junit
      - name: Clean after
        if: always()
        uses: ./.github/actions/git-clean

  # `tools/build-scripts`' `stdlib-api-check` runs what the retired build CLI's `backend
  # stdlib-api-check` ran, against the downloaded distribution at the build job's version.
  standard-library-api-check:
    name: Standard Library API check (linux, amd64)
    if: inputs.os == 'linux' && inputs.linux-checks
    needs: [build-engine-distribution]
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    steps:
      - name: Checking out the repository
        uses: actions/checkout@v5
        with:
          clean: false
      - uses: ./.github/actions/setup-node
      - name: Clean before
        uses: ./.github/actions/git-clean
      - name: Set up the build scripts
        uses: ./.github/actions/setup-build-scripts
      - name: Download the engine distribution
        uses: ./.github/actions/download-engine-distribution
        with:
          name: Engine Distribution (${{ inputs.edition }}) (native,test) (${{ inputs.os }}, ${{ inputs.arch }})
      - name: Check the Standard Library API
        run: corepack pnpm --filter build-scripts run stdlib-api-check
        env:
          ENSO_VERSION: ${{ needs.build-engine-distribution.outputs.ENSO_VERSION }}
      - name: Clean after
        if: always()
        uses: ./.github/actions/git-clean

  # Note [The Standard Library Suites]
  # ==================================
  # `tools/build-scripts`' `stdlib-test` runs a suite as the retired build CLI's `backend test
  # <suite>` did (see its `src/stdlib-test/run.ts`), and starts the HTTP test helper itself, with
  # sbt (hence `setup-jvm`). What moved out of the retired build CLI into this file:
  # - Postgres and SQL Server are service containers, on Linux only as before (Windows runners have
  #   none, and the self-hosted Mac has no Docker, so they share a job of their own,
  #   `stdlib-tests-without-services`, under the same name). One job with OS-conditional `services:`
  #   is not possible: a Windows runner cannot start the Linux containers, so that job is the same
  #   steps without them. A suite gets a database when its matrix entry asks (`postgres`, `mssql`);
  #   an empty image starts no container, and the runner drops the connection variables that are
  #   empty, since Enso reads an empty variable as "". Images: `postgres:18` (the retired build CLI
  #   took `latest`, 18.6 when this moved) and SQL Server `2022-latest`, as before. Postgres must be
  #   on localhost:5432: `Generic_JDBC_Tests` connects to `jdbc:postgresql:<db>`.
  # - The JVM suite's small JDK has its own step (`small-jdk`), at `target/small-jdk` as before.
  # - GraalPy comes from `setup-jvm` (`graalpy`), for `Examples_Tests`' Python spec.
  # - `ENSO_TEST_JUNIT_DIR` is set here; the retired build CLI wrote it to `GITHUB_ENV` for the
  #   reporter.
  # - `setup-jvm` installs the Rust toolchain (`rust`) before the first sbt call (the small JDK or
  #   the HTTP test helper): see Note [Install The Rust Toolchain Before sbt] in
  #   `.github/actions/setup-jvm`.
  # The engine package is the build job's, at the build job's version.
  stdlib-tests:
    name: Standard Library ${{ matrix.title }} Tests (${{ inputs.edition }}) (${{ inputs.os }}, ${{ inputs.arch }})
    if: inputs.os == 'linux' && inputs.stdlib-suites != '[]'
    needs: [build-engine-distribution]
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    permissions:
      checks: write
    env:
      GRAAL_EDITION: ${{ inputs.edition }}
      ENSO_TEST_JUNIT_DIR: ${{ github.workspace }}/target/test-results
    strategy:
      # Each suite reports on its own, as when they were separate jobs.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.stdlib-suites) }}
    services:
      postgres:
        image: ${{ matrix.postgres && 'postgres:18' || '' }}
        env:
          POSTGRES_DB: enso_test_db
          POSTGRES_USER: enso_test_user
          POSTGRES_PASSWORD: enso_test_password
        ports:
          - 5432:5432
        options: >-
          --shm-size 1gb
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U enso_test_user -d enso_test_db"
          --health-interval 5s --health-timeout 5s --health-retries 30
      sqlserver:
        image: ${{ matrix.mssql && 'mcr.microsoft.com/mssql/server:2022-latest' || '' }}
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "enso_test_password_<YourStrong@Passw0rd>"
        ports:
          - 1433:1433
        options: --shm-size 1gb
    steps:
      - name: Checking out the repository
        uses: actions/checkout@v5
        with:
          clean: false
      - uses: ./.github/actions/setup-node
      - name: Clean before
        uses: ./.github/actions/git-clean
      - name: Set up the build scripts
        uses: ./.github/actions/setup-build-scripts
      - name: Download the engine distribution
        uses: ./.github/actions/download-engine-distribution
        with:
          name: Engine Distribution (${{ inputs.edition }}) (native,test) (${{ inputs.os }}, ${{ inputs.arch }})
      - name: Set up the JVM toolchain
        uses: ./.github/actions/setup-jvm
        with:
          cache-key: stdlib-tests
          edition: ${{ inputs.edition == 'Oracle GraalVM' && 'oracle' || 'community' }}
          graalpy: "true"
          rust: "true"
      - if: matrix.small-jdk && inputs.edition != 'Oracle GraalVM'
        name: Build the small JDK
        run: sbt "-Dbench.compileOnly=false" "-Dsbt.server.autostart=false" "buildSmallJdkForRelease ${{ github.workspace }}/target/small-jdk"
        env:
          ENSO_VERSION: ${{ needs.build-engine-distribution.outputs.ENSO_VERSION }}
          ENSO_EDITION: ${{ needs.build-engine-distribution.outputs.ENSO_EDITION }}
          ENSO_RELEASE_MODE: ${{ needs.build-engine-distribution.outputs.ENSO_RELEASE_MODE }}
          LC_ALL: C.UTF-8
          SBT_SERVER_FORCESTART: "true"
      # The line the retired build CLI waited for (`sqlserver.rs`).
      - if: matrix.mssql
        name: Wait for SQL Server
        run: |-
          for _ in $(seq 150); do
            # Captured first: `grep -q` stops reading early, which `pipefail` would report.
            logs=$(docker logs "$ID" 2>&1)
            if grep -qF "SQL Server is now ready for client connections" <<< "$logs"; then exit 0; fi
            sleep 2
          done
          echo "::error::SQL Server did not start within 300 s."
          docker logs "$ID"
          exit 1
        env:
          ID: ${{ job.services.sqlserver.id }}
      - name: Run the Standard Library tests
        run: corepack pnpm --filter build-scripts run stdlib-test ${{ matrix.suite }}
        env:
          ENSO_VERSION: ${{ needs.build-engine-distribution.outputs.ENSO_VERSION }}
          ENSO_EDITION: ${{ needs.build-engine-distribution.outputs.ENSO_EDITION }}
          ENSO_RELEASE_MODE: ${{ needs.build-engine-distribution.outputs.ENSO_RELEASE_MODE }}
          ENSO_LIB_S3_AWS_ACCESS_KEY_ID: ${{ secrets.ENSO_LIB_S3_AWS_ACCESS_KEY_ID }}
          ENSO_LIB_S3_AWS_REGION: ${{ secrets.ENSO_LIB_S3_AWS_REGION }}
          ENSO_LIB_S3_AWS_SECRET_ACCESS_KEY: ${{ secrets.ENSO_LIB_S3_AWS_SECRET_ACCESS_KEY }}
          ENSO_POSTGRES_DATABASE: ${{ matrix.postgres && 'enso_test_db' || '' }}
          ENSO_POSTGRES_HOST: ${{ matrix.postgres && 'localhost:5432' || '' }}
          ENSO_POSTGRES_USER: ${{ matrix.postgres && 'enso_test_user' || '' }}
          ENSO_POSTGRES_PASSWORD: ${{ matrix.postgres && 'enso_test_password' || '' }}
          ENSO_SQLSERVER_DATABASE: ${{ matrix.mssql && 'tempdb' || '' }}
          ENSO_SQLSERVER_HOST: ${{ matrix.mssql && 'localhost' || '' }}
          ENSO_SQLSERVER_PORT: ${{ matrix.mssql && '1433' || '' }}
          ENSO_SQLSERVER_USER: ${{ matrix.mssql && 'sa' || '' }}
          ENSO_SQLSERVER_PASSWORD: ${{ matrix.mssql && 'enso_test_password_<YourStrong@Passw0rd>' || '' }}
      - if: (success() || failure()) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        name: Standard Library Test Reporter
        uses: dorny/test-reporter@v1
        with:
          # Only the AWS suite may report no tests, as before.
          fail-on-empty: ${{ matrix.suite != 'std-aws' }}
          max-annotations: 50
          name: Standard Library Tests Report (${{ inputs.edition }}, ${{ inputs.os }}, ${{ inputs.arch }})
          path: ${{ env.ENSO_TEST_JUNIT_DIR }}/*/*.xml
          path-replace-backslashes: true
          reporter: java-junit
      - if: (success() || failure()) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        name: Upload Heap Dumps
        uses: actions/upload-artifact@v5
        with:
          if-no-files-found: ignore
          name: Heap dumps (Standard Library ${{ matrix.title }} Tests, ${{ inputs.os }}, ${{ inputs.arch }})
          path: |-
            test/**/*.hprof
            engine/**/*.hprof
          retention-days: 3
      - name: Clean after
        if: always()
        uses: ./.github/actions/git-clean

  # The same as `stdlib-tests`, without the databases: Windows runners have no service containers,
  # and the self-hosted Mac has no Docker (the retired build CLI started the databases on Linux
  # only).
  stdlib-tests-without-services:
    name: Standard Library ${{ matrix.title }} Tests (${{ inputs.edition }}) (${{ inputs.os }}, ${{ inputs.arch }})
    if: inputs.os != 'linux' && inputs.stdlib-suites != '[]'
    needs: [build-engine-distribution]
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    permissions:
      checks: write
    env:
      GRAAL_EDITION: ${{ inputs.edition }}
      ENSO_TEST_JUNIT_DIR: ${{ github.workspace }}/target/test-results
    strategy:
      # Each suite reports on its own, as when they were separate jobs.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.stdlib-suites) }}
    steps:
      - name: Checking out the repository
        uses: actions/checkout@v5
        with:
          clean: false
      - uses: ./.github/actions/setup-node
      - name: Clean before
        uses: ./.github/actions/git-clean
      - name: Set up the build scripts
        uses: ./.github/actions/setup-build-scripts
      - name: Download the engine distribution
        uses: ./.github/actions/download-engine-distribution
        with:
          name: Engine Distribution (${{ inputs.edition }}) (native,test) (${{ inputs.os }}, ${{ inputs.arch }})
      - name: Set up the JVM toolchain
        uses: ./.github/actions/setup-jvm
        with:
          cache-key: stdlib-tests
          edition: ${{ inputs.edition == 'Oracle GraalVM' && 'oracle' || 'community' }}
          graalpy: "true"
          rust: "true"
      - if: matrix.small-jdk && inputs.edition != 'Oracle GraalVM'
        name: Build the small JDK
        run: sbt "-Dbench.compileOnly=false" "-Dsbt.server.autostart=false" "buildSmallJdkForRelease ${{ github.workspace }}/target/small-jdk"
        env:
          ENSO_VERSION: ${{ needs.build-engine-distribution.outputs.ENSO_VERSION }}
          ENSO_EDITION: ${{ needs.build-engine-distribution.outputs.ENSO_EDITION }}
          ENSO_RELEASE_MODE: ${{ needs.build-engine-distribution.outputs.ENSO_RELEASE_MODE }}
          LC_ALL: C.UTF-8
          SBT_SERVER_FORCESTART: "true"
      - name: Run the Standard Library tests
        run: corepack pnpm --filter build-scripts run stdlib-test ${{ matrix.suite }}
        env:
          ENSO_VERSION: ${{ needs.build-engine-distribution.outputs.ENSO_VERSION }}
          ENSO_EDITION: ${{ needs.build-engine-distribution.outputs.ENSO_EDITION }}
          ENSO_RELEASE_MODE: ${{ needs.build-engine-distribution.outputs.ENSO_RELEASE_MODE }}
          ENSO_LIB_S3_AWS_ACCESS_KEY_ID: ${{ secrets.ENSO_LIB_S3_AWS_ACCESS_KEY_ID }}
          ENSO_LIB_S3_AWS_REGION: ${{ secrets.ENSO_LIB_S3_AWS_REGION }}
          ENSO_LIB_S3_AWS_SECRET_ACCESS_KEY: ${{ secrets.ENSO_LIB_S3_AWS_SECRET_ACCESS_KEY }}
      - if: (success() || failure()) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        name: Standard Library Test Reporter
        uses: dorny/test-reporter@v1
        with:
          # Only the AWS suite may report no tests, as before.
          fail-on-empty: ${{ matrix.suite != 'std-aws' }}
          max-annotations: 50
          name: Standard Library Tests Report (${{ inputs.edition }}, ${{ inputs.os }}, ${{ inputs.arch }})
          path: ${{ env.ENSO_TEST_JUNIT_DIR }}/*/*.xml
          path-replace-backslashes: true
          reporter: java-junit
      - if: (success() || failure()) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        name: Upload Heap Dumps
        uses: actions/upload-artifact@v5
        with:
          if-no-files-found: ignore
          name: Heap dumps (Standard Library ${{ matrix.title }} Tests, ${{ inputs.os }}, ${{ inputs.arch }})
          path: |-
            test/**/*.hprof
            engine/**/*.hprof
          retention-days: 3
      - name: Clean after
        if: always()
        uses: ./.github/actions/git-clean
