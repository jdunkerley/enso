# This file is not auto-generated. Feel free to edit it.

name: ✨ GUI

on:
  push:
    branches:
      - develop
  pull_request:
    # `labeled`/`unlabeled` so that adding or removing `CI: Build IDE` re-evaluates the checks.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Runs started by any label other than `CI: Build IDE` are inert: see Note [Ignoring Unrelated Label
# Events] in `ide-pull-request.yml`. Keep the copies of that test in sync.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-gui-pull-request${{ ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'CI: Build IDE') && format('-unrelated-label-{0}', github.run_id) || '' }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

permissions:
  contents: read # Read-only access to repository contents
  issues: write # Write access to issues
  pull-requests: write # Write access to pull requests
  statuses: write # Write access to commit statuses
  checks: write
  id-token: write
  pages: write

jobs:
  gui-changed-files:
    name: 🔍 Files Changed
    uses: ./.github/workflows/gui-changed-files.yml
    if: "${{ !((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'CI: Build IDE') }}"
    secrets: inherit

  prettier:
    name: 🧹 Prettier
    runs-on: ubuntu-latest
    if: "${{ !((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'CI: Build IDE') }}"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: false
      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        name: ⎔ Setup Node
        with:
          node-version-file: .node-version
          cache: "pnpm"
      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/cache/restore@v4
        name: Download cache
        id: cache
        with:
          path: |
            node_modules/.cache/prettier
          key: ${{ runner.os }}-gui-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-gui
      - name: Run prettier
        run: pnpm run ci:prettier
      - name: 💾 Save cache
        uses: actions/cache/save@v4
        if: always() && steps.cache.outputs.cache-hit != 'true'
        id: save-cache
        with:
          key: ${{ steps.cache.outputs.cache-primary-key }}
          path: |
            node_modules/.cache/prettier

  # Runs the GUI checks (lint, then playwright) only after Prettier has passed, and on pull requests
  # only when GUI files changed or the PR has the `CI: Build IDE` label. Every other event always runs
  # them.
  gui-checks:
    name: 🧰 Checks
    uses: ./.github/workflows/gui-checks.yml
    needs: [gui-changed-files, prettier]
    if: >-
      needs.gui-changed-files.outputs.any_changed == 'true'
      || contains(github.event.pull_request.labels.*.name, 'CI: Build IDE')
      || github.event_name != 'pull_request'
    secrets: inherit

  required-checks:
    # See Note [Ignoring Unrelated Label Events] in `ide-pull-request.yml`.
    name: "${{ ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'CI: Build IDE') && 'GUI Checks (unrelated label change, ignored)' || 'GUI Required Checks' }}"
    runs-on: ubuntu-latest
    needs: [gui-changed-files, prettier, gui-checks]
    if: "${{ always() && !((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'CI: Build IDE') }}"
    steps:
      - name: Checks Summary
        env:
          FILES_RESULT: ${{ needs.gui-changed-files.result }}
          PRETTIER_RESULT: ${{ needs.prettier.result }}
          GUI_CHECKS_RESULT: ${{ needs.gui-checks.result }}
          # Mirrors the `if:` of `gui-checks`.
          GUI_CHECKS_EXPECTED: >-
            ${{
              needs.gui-changed-files.outputs.any_changed == 'true'
              || contains(github.event.pull_request.labels.*.name, 'CI: Build IDE')
              || github.event_name != 'pull_request'
            }}
        run: |
          echo "Prettier: $PRETTIER_RESULT"
          echo "GUI Checks: $GUI_CHECKS_RESULT (expected to run: $GUI_CHECKS_EXPECTED)"

          # Without a successful changed-files check, "nothing changed" cannot be trusted. Prettier
          # checks every file, Markdown included, so it is expected on every run.
          for result in "$FILES_RESULT" "$PRETTIER_RESULT"; do
            if [[ "$result" != 'success' ]]; then
              echo "A prerequisite did not succeed ($result)."
              exit 1
            fi
          done

          case "$GUI_CHECKS_RESULT" in
            'failure')
              exit 1
              ;;
            'skipped' | 'cancelled')
              if [[ "$GUI_CHECKS_EXPECTED" == 'true' ]]; then
                exit 1
              fi
              ;;
          esac

          echo "Success!"
