# This file is not auto-generated. Feel free to edit it.

name: ✨ IDE

on:
  push:
    branches:
      - develop
  pull_request:
    # `labeled`/`unlabeled` so that adding or removing `CI: Build IDE` re-evaluates the packaging.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Note [Ignoring Unrelated Label Events]
# ======================================
# Every label change on a PR starts a run of this workflow, but only `CI: Build IDE` can change what
# it does. A run started by any other label (an "unrelated label event") must be inert:
# - it gets a concurrency group of its own, so it does not cancel a packaging run in progress;
# - all its jobs are skipped;
# - its summary job is given a different name. A skipped job reports success, and GitHub judges a
#   required check by the most recent check run with that name on the commit, so a skipped
#   "IDE Required Checks" would override (and could hide) the real result of the earlier run.
# The test for an unrelated label event is repeated in each job, as workflow-level `env` is not
# available in `jobs.<id>.if`. Keep the copies (here and in `gui-pull-request.yml`) in sync.

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-ide-pull-request${{ ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'CI: Build IDE') && format('-unrelated-label-{0}', github.run_id) || '' }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

jobs:
  gui-changed-files:
    name: 🔍 GUI Files Changed
    uses: ./.github/workflows/gui-changed-files.yml
    if: "${{ !((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'CI: Build IDE') }}"
    secrets: inherit

  ide-changed-files:
    name: 🔍 IDE Files Changed
    uses: ./.github/workflows/ide-changed-files.yml
    if: "${{ !((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'CI: Build IDE') }}"
    secrets: inherit

  engine-changed-files:
    name: 🔍 Engine Files Changed
    uses: ./.github/workflows/engine-changed-files.yml
    if: "${{ !((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'CI: Build IDE') }}"
    secrets: inherit

  # Pull requests package the IDE only when something that goes into the package (or builds it)
  # changed: GUI sources other than the GUI's own tests, the build plumbing, or the bundled engine and
  # standard library. The `CI: Build IDE` label forces it. Every other event always packages.
  ide-packaging:
    name: 📦 Package
    uses: ./.github/workflows/ide-packaging.yml
    needs: [gui-changed-files, ide-changed-files, engine-changed-files]
    if: >-
      needs.gui-changed-files.outputs.any_changed_excluding_tests == 'true'
      || needs.ide-changed-files.outputs.any_changed == 'true'
      || needs.engine-changed-files.outputs.any_changed == 'true'
      || contains(github.event.pull_request.labels.*.name, 'CI: Build IDE')
      || github.event_name != 'pull_request'
    secrets: inherit

  required-checks:
    # See Note [Ignoring Unrelated Label Events].
    name: "${{ ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'CI: Build IDE') && 'IDE Checks (unrelated label change, ignored)' || 'IDE Required Checks' }}"
    runs-on: ubuntu-latest
    needs:
      - gui-changed-files
      - ide-changed-files
      - engine-changed-files
      - ide-packaging
    if: "${{ always() && !((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'CI: Build IDE') }}"
    steps:
      - name: Checks Summary
        env:
          GUI_FILES_RESULT: ${{ needs.gui-changed-files.result }}
          IDE_FILES_RESULT: ${{ needs.ide-changed-files.result }}
          ENGINE_FILES_RESULT: ${{ needs.engine-changed-files.result }}
          PACKAGING_RESULT: ${{ needs.ide-packaging.result }}
          # Mirrors the `if:` of `ide-packaging`.
          PACKAGING_EXPECTED: >-
            ${{
              needs.gui-changed-files.outputs.any_changed_excluding_tests == 'true'
              || needs.ide-changed-files.outputs.any_changed == 'true'
              || needs.engine-changed-files.outputs.any_changed == 'true'
              || contains(github.event.pull_request.labels.*.name, 'CI: Build IDE')
              || github.event_name != 'pull_request'
            }}
        run: |
          echo "IDE: $PACKAGING_RESULT (expected to run: $PACKAGING_EXPECTED)"

          # Without a successful changed-files check, "nothing changed" cannot be trusted.
          for result in "$GUI_FILES_RESULT" "$IDE_FILES_RESULT" "$ENGINE_FILES_RESULT"; do
            if [[ "$result" != 'success' ]]; then
              echo "A changed-files check did not succeed ($result)."
              exit 1
            fi
          done

          case "$PACKAGING_RESULT" in
            'failure')
              exit 1
              ;;
            'skipped' | 'cancelled')
              if [[ "$PACKAGING_EXPECTED" == 'true' ]]; then
                exit 1
              fi
              ;;
          esac

          echo "Success!"
