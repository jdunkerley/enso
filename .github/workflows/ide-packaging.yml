# Hand-written. Builds the backend on each platform and the GUI once, packages the IDE for Linux
# and Windows, and runs the package tests: called by `ide-pull-request.yml`, and can be started by
# hand.

name: IDE Packaging
on:
  workflow_dispatch:
    inputs:
      clean_build_required:
        description: Clean before and after the run.
        required: false
        type: boolean
        default: false
      build_backend:
        description: >-
          Build the backend. When false, the packaging uses the backend of the newest develop run
          whose commit is an ancestor of the commit being packaged.
        required: false
        type: boolean
        default: true
      open_perf:
        description: Measure the open time (app/electron-client/perf/openTime.ts).
        required: false
        type: boolean
        default: false
      open_perf_jvm:
        description: >-
          Measure the open time on the JVM too (with an AOT cache), after native, on the same
          build.
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      build_backend:
        description: >-
          Build the backend. When false (a PR that changes no engine file), the packaging uses the
          backend of the newest develop run whose commit is an ancestor of the commit being packaged (the PR's merge commit).
        type: boolean
        default: true
      open_perf:
        description: >-
          Measure the open time: every develop push, and pull requests with the `CI: Open perf`
          label.
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-ide-packaging
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

env:
  # Read by `.github/actions/git-clean`.
  ENSO_CI_CLEAN_BUILD: "${{ contains(github.event.pull_request.labels.*.name, 'CI: Clean build required') || github.ref == 'refs/heads/develop' || inputs.clean_build_required == true }}"

# Note [Platform Legs Run Despite The Other Platform's Failure]
# ============================================================
# A job that needs a matrix job needs every leg of it, and sees one result for all of them. By
# default a Windows backend that fails would therefore skip the Linux packaging too. So:
# - `package-ide` runs unless the run is cancelled or `gui-build` failed. A failed backend leaves
#   the other platform's packaging running; the failed platform's own packaging leg then fails at
#   "Download backend".
# - A failed `gui-build` skips its dependents (both platforms), rather than letting them run and
#   fail at their download steps, which would show one root failure as several red jobs.
# The Linux legs wait for the slower Windows ones, which does not lengthen the run: the Windows legs
# are its longest path.

# Note [Reusing Develop's Backend]
# ==================================
# A pull request to develop packages the IDE with the backend that develop already built, instead of
# rebuilding it (`build_backend` is false; `ide-pull-request.yml` decides), unless it changes an
# engine file (`engine-changed-files.yml`), a file the backend build reads outside the engine paths
# (`backend_changed` in `ide-changed-files.yml`: the ydoc server and its workspace dependencies, the
# manifests, and this file), or carries the `CI: Build IDE` label. A pull request to any other base
# (stacked on another branch) always builds it, as develop's backend may lack the base's changes.
# `find-backend` picks the newest develop run whose `backend-linux` artifact is unexpired, whose
# commit is an ancestor of the commit being packaged (`github.sha`: on a pull request its merge
# commit, which `package-ide` checks out, so the backend is never newer than the GUI), which is a run
# of this repository (not a fork's branch named `develop`), and which also has `backend-windows`.
# The search reaches back only as far as the first 100 `backend-linux` artifacts (any branch) and the
# first 30 develop candidates among them. `package-ide` downloads from that run. `build_backend` is declared on
# `workflow_dispatch` too, with a default: an undeclared input is null, and in an expression
# `null == false` is true (both coerce to 0), which would skip the build on a hand-started run.

permissions:
  actions: read
  contents: read

jobs:
  # Note [The Engine Bundle]
  # ========================
  # The retired build CLI's `backend get` is the sbt task `buildEngineBundle`
  # (project/EngineBundle.scala): the engine distribution, the IR cache check, the MSVC runtime DLLs
  # on Windows (`setup-msvc` provides the environment), the small JDK, and the bundle in
  # `built-distribution/engine-bundle-<version>-<os>-amd64/enso`, which is archived as it is (the
  # retired build CLI mirrored it to `dist/backend` first). sbt is called as the retired build CLI
  # called it; the version comes from `tools/build-scripts` (`version`), and `ENSO_LAUNCHER` stays
  # `native`. `setup-jvm` installs the Rust toolchain (`rust`) before sbt starts several `cargo`
  # calls at once (Note [Install The Rust Toolchain Before sbt] in `.github/actions/setup-jvm`).
  build-backend:
    name: Build Backend (${{ matrix.os }}, amd64)
    # `!= false`, not `== true`: see Note [Reusing Develop's Backend].
    if: ${{ inputs.build_backend != false }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
    env:
      ENSO_LAUNCHER: native
      # Note [The Engine's Cargo Target Directory] in `engine-checks-platform.yml`.
      CARGO_TARGET_DIR: ${{ github.workspace }}/../cargo-target
    steps:
      - name: Checking out the repository
        uses: actions/checkout@v5
        with:
          clean: false
      - uses: ./.github/actions/setup-node
      # The prebuilt CLI: otherwise the ydoc bundle's `postinstall` (`app/rust-ffi/build-wasm.mjs`)
      # runs `cargo install wasm-bindgen-cli`, 1.2 min on Linux and 3 on Windows. The version must be
      # `WASM_BINDGEN_VERSION` in `build-wasm.mjs` (`check-workflows.mjs` checks it).
      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.128
      - name: Clean before
        uses: ./.github/actions/git-clean
      - name: Set up the build scripts
        uses: ./.github/actions/setup-build-scripts
      - name: Set up the JVM toolchain
        uses: ./.github/actions/setup-jvm
        with:
          cache-key: engine
          flatc: "true"
          rust: "true"
      - name: Set up the Rust cache
        uses: ./.github/actions/setup-rust
        with:
          shared-key: engine
          save: "false"
          workspaces: ". -> ../cargo-target"
      - name: Set up MSVC
        uses: ./.github/actions/setup-msvc
      - id: version
        name: Compute the version
        run: corepack pnpm --filter build-scripts run version
      - name: Build the engine bundle
        run: sbt "-Dbench.compileOnly=false" "-Dsbt.server.autostart=false" "clean; all buildEngineBundle"
        env:
          LC_ALL: C.UTF-8
          SBT_SERVER_FORCESTART: "true"
      - if: matrix.os == 'linux'
        name: Upload Edition File
        uses: actions/upload-artifact@v5
        with:
          name: Edition File
          path: distribution/editions/*.yaml
      - if: matrix.os == 'linux'
        name: Upload fbs-schema
        uses: actions/upload-artifact@v5
        with:
          name: fbs-schema
          path: engine/language-server/src/main/schema/
      - name: Archive backend
        run: tar -cvf backend.tar -C built-distribution/engine-bundle-${{ steps.version.outputs.ENSO_VERSION }}-${{ matrix.os }}-amd64/enso .
      - name: Upload backend
        uses: actions/upload-artifact@v5
        with:
          name: backend-${{ matrix.os }}
          path: backend.tar
      - name: Cleanup
        run: rm backend.tar
      - name: Clean after
        if: always()
        uses: ./.github/actions/git-clean

  find-backend:
    name: Find develop's backend
    # See Note [Reusing Develop's Backend].
    if: ${{ inputs.build_backend == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          candidates=$(gh api -X GET "repos/$REPO/actions/artifacts" -f name=backend-linux -f per_page=100 \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "develop" and .workflow_run.head_repository_id == .workflow_run.repository_id)
                   | "\(.workflow_run.id) \(.workflow_run.head_sha)"] | .[:30] | .[]')
          while read -r run_id sha; do
            [ -n "$run_id" ] || continue
            # Only pull-request runs of the IDE workflow build a backend (release.yml also runs on develop).
            path=$(gh api "repos/$REPO/actions/runs/$run_id" --jq .path) || continue
            [ "$path" = ".github/workflows/ide-pull-request.yml" ] || continue
            status=$(gh api "repos/$REPO/compare/$sha...$HEAD_SHA" --jq .status) || continue
            case "$status" in ahead|identical) ;; *) continue ;; esac
            windows=$(gh api "repos/$REPO/actions/runs/$run_id/artifacts" \
              --jq '[.artifacts[] | select(.name == "backend-windows" and (.expired | not))] | length') || continue
            [ "$windows" -ge 1 ] || continue
            echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
            echo "Backend not built: no engine or ydoc server files changed. Using develop run [$run_id](https://github.com/$REPO/actions/runs/$run_id) at \`$sha\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          done <<< "$candidates"
          echo "::error::No develop backend whose commit is an ancestor of $HEAD_SHA (the commit being packaged). Merge develop into the branch, or add the 'CI: Build IDE' label to build one."
          exit 1

  gui-build:
    name: GUI build (linux, amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checking out the repository
        uses: actions/checkout@v5
        with:
          clean: false
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: wasm-parser
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Keep the version in step with `wasm-bindgen` in `Cargo.lock` and with `gui-checks.yml`.
      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.128
      - name: Derive GUI version
        run: echo "ENSO_IDE_VERSION=$(date -u '+%Y.%-m.%-d')-dev" >> "$GITHUB_ENV"
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: corepack pnpm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build GUI
        run: corepack pnpm run build:gui --mode=production
        env:
          ENSO_IDE_AG_GRID_LICENSE_KEY: ${{ vars.ENSO_AG_GRID_LICENSE_KEY }}
          ENSO_IDE_COMMIT_HASH: ${{ github.sha }}
          ENSO_IDE_GOOGLE_ANALYTICS_TAG: ${{ vars.ENSO_CLOUD_GOOGLE_ANALYTICS_TAG }}
          ENSO_IDE_HOST: ${{ vars.ENSO_HOST }}
          ENSO_IDE_SENTRY_DSN: ${{ vars.ENSO_CLOUD_SENTRY_DSN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: production
      - name: Collect GUI artifacts
        run: mkdir -p dist/gui/assets && cp -R app/gui/dist/. dist/gui/assets/
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload gui
        uses: actions/upload-artifact@v5
        with:
          name: gui
          path: dist/gui/
      - name: Upload WASM parser artifacts
        uses: actions/upload-artifact@v5
        with:
          if-no-files-found: error
          name: wasm-artifacts
          path: |-
            app/rust-ffi/dist
            app/ydoc-shared/src/ast/generated
          retention-days: 1

  # `tools/build-scripts`' `ide-build` packages the IDE as the retired build CLI's `ide build
  # --backend-source local --gui-source local` did: the version, `pnpm install`, then `build:ide`
  # and `dist:ide` with the variables electron-builder reads, and without the empty code-signing
  # variables (a fork has no certificate). electron-builder writes the installer's `.sha256` itself.
  package-ide:
    name: Package New IDE (${{ matrix.os }}, amd64)
    needs: [build-backend, find-backend, gui-build]
    # See Note [Platform Legs Run Despite The Other Platform's Failure]. `find-backend` is skipped
    # when the backend is built; when it ran and failed, there is no backend to package.
    if: ${{ !cancelled() && needs.gui-build.result == 'success' && needs.find-backend.result != 'failure' }}
    runs-on: ${{ matrix.runner }}
    # 30 as before; only a run that measures gets more (the measuring steps have timeouts of their
    # own, which `continue-on-error` absorbs, so a runaway never reaches this one).
    timeout-minutes: ${{ (inputs.open_perf == true || inputs.open_perf == 'true') && (inputs.open_perf_jvm && 120 || 75) || 30 }}
    env:
      OPEN_PERF: ${{ inputs.open_perf == true || inputs.open_perf == 'true' }}
      OPEN_PERF_ENGINES: ${{ inputs.open_perf_jvm && 'native,jvm' || 'native' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            installer: dist/ide/enso-*.AppImage
          - os: windows
            runner: windows-latest
            installer: dist/ide/enso-*.exe
    steps:
      - name: Checking out the repository
        uses: actions/checkout@v5
        with:
          clean: false
          fetch-depth: 2
      - uses: ./.github/actions/setup-node
      - name: Clean before
        uses: ./.github/actions/git-clean
      - name: Set up the build scripts
        uses: ./.github/actions/setup-build-scripts
      - name: Download backend
        uses: actions/download-artifact@v5
        with:
          name: backend-${{ matrix.os }}
          path: dist/backend
          # develop's run when `find-backend` ran, otherwise this one.
          run-id: ${{ needs.find-backend.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
      - run: |-
          tar -xvf dist/backend/backend.tar -C dist/backend
          rm dist/backend/backend.tar
      - name: Download GUI
        uses: actions/download-artifact@v5
        with:
          name: gui
          path: dist/gui
      - name: Download WASM parser artifacts
        uses: actions/download-artifact@v5
        with:
          name: wasm-artifacts
          path: app
      - if: matrix.os == 'linux'
        name: Package the IDE
        run: corepack pnpm --filter build-scripts run ide-build
        env:
          ENSO_IDE_AG_GRID_LICENSE_KEY: ${{ vars.ENSO_AG_GRID_LICENSE_KEY }}
          ENSO_IDE_GOOGLE_ANALYTICS_TAG: ${{ vars.ENSO_CLOUD_GOOGLE_ANALYTICS_TAG }}
          ENSO_IDE_HOST: ${{ vars.ENSO_HOST }}
          ENSO_IDE_SENTRY_DSN: ${{ vars.ENSO_CLOUD_SENTRY_DSN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: matrix.os == 'windows'
        name: Package the IDE
        run: corepack pnpm --filter build-scripts run ide-build
        env:
          ENSO_IDE_AG_GRID_LICENSE_KEY: ${{ vars.ENSO_AG_GRID_LICENSE_KEY }}
          ENSO_IDE_GOOGLE_ANALYTICS_TAG: ${{ vars.ENSO_CLOUD_GOOGLE_ANALYTICS_TAG }}
          ENSO_IDE_HOST: ${{ vars.ENSO_HOST }}
          ENSO_IDE_SENTRY_DSN: ${{ vars.ENSO_CLOUD_SENTRY_DSN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.MICROSOFT_CODE_SIGNING_CERT_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.MICROSOFT_CODE_SIGNING_CERT }}
      - name: Upload ide
        uses: actions/upload-artifact@v5
        with:
          name: ide-${{ matrix.os }}
          path: ${{ matrix.installer }}
      - if: matrix.os == 'windows'
        name: Smoke-test the installer
        run: ./tools/ci/windows-installer-smoke.ps1 -Installer (Get-Item dist/ide/enso-win-x64-*.exe).FullName
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: matrix.os == 'linux'
        name: Run Package Tests
        run: xvfb-run corepack pnpm -r --filter enso ide-integration-test
        env:
          DEBUG: "pw:browser log:"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: matrix.os == 'windows'
        name: Run Package Tests
        run: corepack pnpm -r --filter enso ide-integration-test
        env:
          DEBUG: "pw:browser log:"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Note [Open Time In CI]
      # ======================
      # `app/electron-client/perf/openTime.ts` opens two new projects per launch, five launches,
      # and records when each phase of an open ends (spec
      # docs/superpowers/specs/2026-11-01-project-open-performance-design.md, section 2). It runs on
      # develop pushes, on pull requests with the `CI: Open perf` label and when started by hand
      # (`open_perf`, and `open_perf_jvm` for the JVM beside native). It compares with the median
      # of the last five develop runs' `open-perf-<os>` artifacts (Note [Noisy Medians] in
      # openTimeReport.ts) and warns, never fails: shared runners are noisy, so these steps
      # continue on error (`checkOpenPerf` in tools/ci/check-workflows.mjs). The extras
      # (component browser, `format` widget) share a 15 s budget per open (Note [Extras Are
      # Bounded] in openTime.ts), so that five launches fit the 12-minute budget on Windows too.
      - if: env.OPEN_PERF == 'true'
        name: Download develop's last open times
        id: open-perf-baseline
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OS: ${{ matrix.os }}
          RUN_ID: ${{ github.run_id }}
        run: |
          run_ids=$(gh api -X GET "repos/$REPO/actions/artifacts" -f name="open-perf-$OS" -f per_page=50 \
            --jq "[.artifacts[] | select(.expired | not)
                   | select(.workflow_run.head_branch == \"develop\" and .workflow_run.head_repository_id == .workflow_run.repository_id)
                   | select(.workflow_run.id != $RUN_ID)] | .[0:5][].workflow_run.id")
          for id in $run_ids; do
            gh run download "$id" --repo "$REPO" --name "open-perf-$OS" --dir "open-perf-baseline/$id" \
              || echo "Open time: no baseline from run $id"
          done
      - if: env.OPEN_PERF == 'true' && matrix.os == 'linux'
        name: Measure the open time
        continue-on-error: true
        timeout-minutes: ${{ inputs.open_perf_jvm && 60 || 25 }}
        run: >-
          xvfb-run corepack pnpm --filter enso run perf:open --out
          "$GITHUB_WORKSPACE/open-perf" --runs 5 --engines "$OPEN_PERF_ENGINES"
          --budget-minutes 12 --baseline
          "$GITHUB_WORKSPACE/open-perf-baseline" --summary
          "$GITHUB_STEP_SUMMARY"
      - if: env.OPEN_PERF == 'true' && matrix.os == 'windows'
        name: Measure the open time
        continue-on-error: true
        timeout-minutes: ${{ inputs.open_perf_jvm && 60 || 25 }}
        run: >-
          corepack pnpm --filter enso run perf:open --out
          "$env:GITHUB_WORKSPACE/open-perf" --runs 5 --engines
          "$env:OPEN_PERF_ENGINES" --budget-minutes 12 --baseline
          "$env:GITHUB_WORKSPACE/open-perf-baseline" --summary
          "$env:GITHUB_STEP_SUMMARY"
      - if: env.OPEN_PERF == 'true' && !cancelled()
        name: Upload the open time
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v5
        with:
          name: open-perf-${{ matrix.os }}
          path: |
            open-perf/open-time.json
            open-perf/open-time.md
            open-perf/*/marks.json
            open-perf/*/*.png
            open-perf/*/logs
          if-no-files-found: warn
      - if: failure()
        name: Upload Test Traces
        uses: actions/upload-artifact@v5
        with:
          compression-level: 0
          name: test-traces-${{ matrix.os }}-amd64
          path: app/electron-client/test-traces
      - name: Clean after
        if: always()
        uses: ./.github/actions/git-clean
