# This file is not auto-generated. Feel free to edit it.

name: GUI Changed Files

on:
  workflow_call:
    outputs:
      all_changed_files:
        description: "Returns all changed files"
        value: ${{ jobs.gui-changed-files.outputs.all_changed_files }}
      any_changed:
        description: "Returns `true` when any of the filenames have changed"
        value: ${{ jobs.gui-changed-files.outputs.any_changed }}
      any_changed_excluding_tests:
        description: "Returns `true` when any of the filenames other than GUI tests have changed"
        value: ${{ jobs.gui-changed-files.outputs.any_changed_excluding_tests }}

# Markdown is ignored: no GUI code or test reads a `.md` file, so a documentation-only change
# (READMEs, CLAUDE.md) cannot affect the GUI checks. Prettier, which does format Markdown, is not
# gated on this workflow.
jobs:
  gui-changed-files:
    runs-on: ubuntu-latest
    name: Changed Files
    outputs:
      all_changed_files: ${{ steps.gui-changed-files.outputs.all_changed_files }}
      any_changed: ${{ steps.gui-changed-files.outputs.any_changed }}
      any_changed_excluding_tests: ${{ steps.gui-changed-files-excluding-tests.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Get changed files
        id: gui-changed-files
        uses: step-security/changed-files@v45
        with:
          files: |
            app/**
            lib/rust/**
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            .npmrc
            .pnpmfile.cjs
            .node-version
            tsconfig.json
            eslint.config.mjs
            .prettierrc.yaml
            .prettierignore
            vitest.workspace.ts
            .github/workflows/gui*
          files_ignore: |
            app/gui/scripts/**
            app/gui/.gitignore
            .git-*
            **/*.md
      # The same set minus the GUI's own unit and Playwright tests and their configuration, which
      # the IDE package neither contains nor runs (packaging is `vite build` with `vite.config.ts`).
      # Keep the two lists in sync.
      - name: Get changed files, excluding GUI tests
        id: gui-changed-files-excluding-tests
        uses: step-security/changed-files@v45
        with:
          files: |
            app/**
            lib/rust/**
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            .npmrc
            .pnpmfile.cjs
            .node-version
            tsconfig.json
            eslint.config.mjs
            .prettierrc.yaml
            .prettierignore
            vitest.workspace.ts
            .github/workflows/gui*
          files_ignore: |
            app/gui/scripts/**
            app/gui/.gitignore
            .git-*
            **/*.md
            app/gui/**/__tests__/**
            app/gui/**/*.test.ts
            app/gui/integration-test/**
            app/gui/src/dashboard/test/**
            app/gui/vitest.config.ts
            app/gui/vite.test.config.ts
            app/gui/playwright.config.ts
            app/gui/tsconfig.app.vitest.json
      - name: List all changed files
        env:
          ALL_CHANGED_FILES: ${{ steps.gui-changed-files.outputs.all_changed_files }}
        run: |
          if [[ "${{ steps.gui-changed-files.outputs.any_changed }}" == "true" ]]; then
            echo "Files changed:"
          fi
          for file in ${ALL_CHANGED_FILES}; do
            echo "$file"
          done
          echo "Changed outside GUI tests: ${{ steps.gui-changed-files-excluding-tests.outputs.any_changed }}"
