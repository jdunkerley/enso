# This file is not auto-generated. Feel free to edit it.

name: GUI Checks
on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          JSON list of runner labels for the lint and Playwright jobs. `macos-pull-request.yml`
          passes the self-hosted macOS runner's; the WASM build and report merge stay on Linux.
        type: string
        default: '["ubuntu-latest"]'
      windows-shim-tests:
        description: >-
          Also run the project-manager-shim unit tests on Windows (`shim-windows`). The macOS run
          passes false: the pull request's own run already has them.
        type: boolean
        default: true

# Cancel in-progress workflows if a new one is started
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-gui-checks
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

permissions:
  actions: read # Download develop's engine distribution artifact
  contents: read
  checks: write # The lint results check (`eslint-annotate-action`)
  pull-requests: read # `eslint-annotate-action` reads the pull request

env:
  # Workaround for https://github.com/nodejs/corepack/issues/612
  # See: https://github.com/nodejs/corepack/blob/main/README.md#environment-variables
  COREPACK_DEFAULT_TO_LATEST: 0

jobs:
  # Compile the Rust parser to WASM (+ generate `ast.ts`) exactly once. Every other job
  # downloads the `wasm-artifacts` artifact into place before `pnpm install`, so the
  # `build-wasm` / `generate-ast` lifecycle scripts see their inputs unchanged and skip
  # the (multi-minute, uncached) Cargo compile.
  build-wasm:
    name: 🦀 Build WASM parser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        name: ⎔ Setup Node
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: 🦀 Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-parser
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: 🎯 Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: 🔧 Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.128

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🏗️ Build WASM parser and generate ast.ts
        run: |
          pnpm --filter rust-ffi run build-wasm
          pnpm --filter ydoc-shared run generate-ast

      - name: ⬆️ Upload parser artifacts
        uses: actions/upload-artifact@v5
        with:
          name: wasm-artifacts
          path: |
            app/rust-ffi/dist
            app/ydoc-shared/src/ast/generated
          if-no-files-found: error
          retention-days: 1

  lint:
    name: 👮 Lint GUI
    needs: [build-wasm]
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        name: ⎔ Setup Node
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: 📥 Download prebuilt WASM parser
        uses: actions/download-artifact@v5
        with:
          name: wasm-artifacts
          path: app

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/cache/restore@v4
        if: "${{ !(contains(github.event.pull_request.labels.*.name, 'CI: Clean build required')) }}"
        name: Download cache
        id: cache
        with:
          path: |
            **/.eslintcache
            **/node_modules/.vite
            !**/node_modules/.vite/vitest
          # vitest's results (`node_modules/.vite/vitest`) are excluded on purpose: its sequencer runs
          # the files that failed last time first, so a cached failure would be rerun first for ever.
          # eslint's `.eslintcache` is keyed only on file content + eslint config, not on the
          # tsconfigs that typed linting depends on. Fold those into the Actions cache key so a
          # tsconfig change starts a fresh eslint cache instead of reusing stale results.
          key: ${{ runner.os }}-gui-lint-${{ hashFiles('eslint.config.mjs', 'tsconfig.json', 'app/gui/tsconfig*.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-gui-lint-${{ hashFiles('eslint.config.mjs', 'tsconfig.json', 'app/gui/tsconfig*.json') }}

      # Caches saved before the exclusion above still hold vitest's results, and `restore-keys` can
      # bring them back, so drop them here too.
      - name: 🧹 Drop cached vitest results
        shell: bash
        run: find . -type d -path '*/node_modules/.vite/vitest' -prune -exec rm -rf {} +

      # Next Tasks are depend on Typecheck, because we build libraries at this stage
      - name: ⚙️ Compile
        id: compile
        continue-on-error: true
        run: pnpm run compile

      - name: 🧠 Typecheck
        id: typecheck
        continue-on-error: true
        run: pnpm run ci:typecheck

      - name: 🧹 Lint
        id: lint
        continue-on-error: true
        run: pnpm run ci:lint

      - name: 📝 Annotate Code Linting Results
        # Lint results do not depend on the OS, and a second "GUI Lint Results" check from the
        # macOS run would only duplicate the Linux one.
        if: always() && runner.os == 'Linux'
        id: eslint-annotate
        continue-on-error: true
        uses: ataylorme/eslint-annotate-action@5a8d8ab89a57679e90c32750e0f382e9d8570750 # 4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          report-json: "./app/*/eslint_report.json"
          markdown-report-on-step-summary: true
          check-name: 🧹 GUI Lint Results
          only-pr-files: false
          fail-on-error: false
          fail-on-warning: false

      # The shim's `ProjectService` tests start a real engine. They get develop's latest engine
      # distribution: the newest unexpired artifact of `engine-pull-request.yml` on develop (kept 90
      # days). Only Linux has one here; elsewhere those tests skip (#359). The artifact lost its
      # `(native,test)` when the native build went (#683); until develop has built the new name,
      # the old one is taken (the shim runs `java` itself, so either distribution serves).
      - name: 🔎 Find develop's engine distribution
        id: engine
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in "Engine Distribution (GraalVM CE) (linux, amd64)" "Engine Distribution (GraalVM CE) (native,test) (linux, amd64)"; do
            run_id=$(gh api -X GET "repos/${{ github.repository }}/actions/artifacts" \
              -f name="$artifact" -f per_page=100 \
              --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "develop")][0].workflow_run.id // empty')
            if [ -n "$run_id" ]; then
              { echo "run-id=$run_id"; echo "artifact=$artifact"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::No unexpired engine distribution artifact from develop. Re-run the Engine workflow on develop."
          exit 1

      - name: 📥 Download develop's engine distribution
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v5
        with:
          name: ${{ steps.engine.outputs.artifact }}
          run-id: ${{ steps.engine.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: 📦 Unpack the engine distribution
        if: runner.os == 'Linux'
        run: |
          tar -xf built-distribution.tar built-distribution
          rm built-distribution.tar
          find built-distribution -path '*/bin/enso' -print -quit | grep .

      # The shim starts every engine as `<runtime>/bin/java` (C1 of the native-image removal), and
      # the distribution above has no bundled runtime, so the `java` on the PATH runs it: it must
      # be the pinned GraalVM (`jvm.options` needs JVMCI), not the runner's own JDK.
      - name: ☕ Set up GraalVM for the engine
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-jvm
        with:
          cache-key: engine
          cache-save: "false"

      - name: 🧪 Unit Tests
        id: unit-tests
        continue-on-error: true
        run: pnpm run ci:unit-test

      - name: ❌ Fail if any check failed
        if: always() && (steps.lint.outcome == 'failure' || steps.compile.outcome == 'failure' || steps.typecheck.outcome == 'failure' || steps.unit-tests.outcome == 'failure')
        run: |
          echo "Lint outcome: ${{ steps.lint.outcome }}"
          echo "Compile outcome: ${{ steps.compile.outcome }}"
          echo "Typecheck outcome: ${{ steps.typecheck.outcome }}"
          echo "Unit tests outcome: ${{ steps.unit-tests.outcome }}"
          exit 1

      - name: 💾 Save cache
        uses: actions/cache/save@v4
        if: always() && steps.cache.outputs.cache-hit != 'true'
        id: save-cache
        with:
          key: ${{ steps.cache.outputs.cache-primary-key }}
          path: |
            **/.eslintcache
            **/node_modules/.vite
            !**/node_modules/.vite/vitest

  # The shim renames, locks and spawns in the user's folders, and Windows refuses things Linux
  # allows (a folder with a file open in it cannot be renamed, #622), so its unit tests also run
  # there. It needs no WASM parser: no shim dependency reaches `ydoc-shared`, so the install skips
  # the lifecycle scripts and compiles only the workspace packages the shim imports.
  shim-windows:
    name: 🪟 Project Manager Shim Tests (Windows)
    if: ${{ inputs.windows-shim-tests }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        name: ⎔ Setup Node
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter "project-manager-shim..."

      - name: ⚙️ Compile the shim's workspace dependencies
        run: pnpm --filter "project-manager-shim^..." run compile

      - name: 🧪 Unit Tests
        # The runner's TEMP is in its 8.3 form (`C:\Users\RUNNER~1\...`), while git and `realpath`
        # answer the long one, so tests comparing a temporary path with what those report fail.
        # `runner.temp` is a long path. The trade-off: these tests no longer see an 8.3 path, so a
        # product bug that only such a path triggers would pass here. Users' project paths do not
        # normally take that form; a test that needs it should build one itself.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: pnpm --filter project-manager-shim run test:unit

  playwright:
    name: 🎭 Playwright Tests
    # Runs alongside lint. A lint failure still fails the GUI checks: `gui-pull-request.yml`'s
    # "GUI Required Checks" reads the result of this whole workflow.
    needs: [build-wasm]
    env:
      NODE_OPTIONS: --disable-warning=ExperimentalWarning
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    steps:
      - uses: actions/checkout@v5

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        name: ⎔ Setup Node
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: 📥 Download prebuilt WASM parser
        uses: actions/download-artifact@v5
        with:
          name: wasm-artifacts
          path: app

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📺 Install Playwright Browsers
        working-directory: app/gui
        run: pnpm run playwright:install

      - name: ⚙️ Compile
        id: compile
        run: pnpm run compile

      - name: 🎭 Playwright Tests
        working-directory: app/gui
        run: pnpm run test:integration --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: ⬆️ Upload blob report to GitHub Actions Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: app/gui/blob-report
          retention-days: 7

  merge-reports:
    name: 🔗 Merge Playwright Reports
    # Merge whenever Playwright actually ran (pass or fail), but not when it was
    # skipped because Build WASM failed.
    if: ${{ !cancelled() && needs.playwright.result != 'skipped' }}
    needs: [playwright]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 📥 Download blob reports from GitHub Actions Artifacts
        uses: actions/download-artifact@v5
        with:
          path: app/gui/blob-report/
          pattern: blob-report-*
          merge-multiple: true

      - name: 🔗 Merge into HTML Report
        id: merge-reports
        working-directory: app/gui
        run: PLAYWRIGHT_JSON_OUTPUT_FILE=${{ github.workspace }}/app/gui/playwright-report/report.json pnpm playwright merge-reports --reporter=html,github,json ./blob-report

      - name: ⬆️ Upload HTML report
        id: upload-html-report
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ github.run_attempt }}-${{ github.run_id }}
          path: app/gui/playwright-report/
          retention-days: 14
