# Hand-written. Adds the `-libs-API-change-<Library>` label to a pull request that changes the API
# signature files (`docs/api`) of a standard library. Runs only from `engine-pull-request.yml`, as
# "🏷 Append labels to PR", on every pull request that workflow runs for (it has the same
# `paths-ignore`, and a `docs/api` file is under `distribution/`, so it is never skipped). Triggers of
# its own would run it twice per pull request.

name: 🏷 Standard Library Labels
on:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  pull-requests: write

jobs:
  stdlib-api-labels:
    name: Standard library API change labels
    # Labels exist only on pull requests; a called workflow sees its caller's event name.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checking out the repository
        uses: actions/checkout@v5
        with:
          clean: false
          fetch-depth: 2
      - id: changed-files
        name: Changed API files
        uses: step-security/changed-files@v45
        with:
          files: distribution/lib/Standard/*/**/docs/api/**/**.md
      - name: Add the labels
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        # `bash` runs with `-eo pipefail`: a failed `gh` call fails the step.
        shell: bash
        run: |
          # The label set is fetched once; if the call fails, so does the step.
          existing=$(gh label list --repo "$REPO" --limit 500 --json name --jq '.[].name')
          # `distribution/lib/Standard/<Library>/...`: the library is the fourth path segment.
          libraries=$(for f in $FILES; do echo "$f" | cut -d/ -f4; done | sort -u)
          for library in $libraries; do
            label="-libs-API-change-$library"
            # Only libraries with a label are labelled (Examples, Geo, ... have none).
            if grep -Fxq -- "$label" <<<"$existing"; then
              gh pr edit "$PR" --repo "$REPO" --add-label "$label"
              echo "Added $label" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "No label $label exists; skipped" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Note that no API file changed
        if: steps.changed-files.outputs.any_changed != 'true'
        run: echo "No standard library API file changed; no label to add." >> "$GITHUB_STEP_SUMMARY"
