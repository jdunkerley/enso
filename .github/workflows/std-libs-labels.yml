# Hand-written. Adds the `-libs-API-change-<Library>` label to a pull request that changes the API
# signature files (`docs/api`) of a standard library. Runs on its own and, from
# `engine-pull-request.yml`, as "🏷 Append labels to PR".

name: 🏷 Standard Library Labels
on:
  push:
    branches:
      - develop
  pull_request:
    # Specs and plans alone start no checks; every `pull_request` workflow ignores them
    # (`tools/ci/check-workflows.mjs` checks it).
    paths-ignore:
      - "docs/superpowers/**"
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  pull-requests: write

jobs:
  stdlib-api-labels:
    name: Standard library API change labels
    # Labels exist only on pull requests; a called workflow sees its caller's event name.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checking out the repository
        uses: actions/checkout@v5
        with:
          clean: false
          fetch-depth: 2
      - id: changed-files
        name: Changed API files
        uses: step-security/changed-files@v45
        with:
          files: distribution/lib/Standard/*/**/docs/api/**/**.md
      - name: Add the labels
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          # `distribution/lib/Standard/<Library>/...`: the library is the fourth path segment.
          libraries=$(for f in $FILES; do echo "$f" | cut -d/ -f4; done | sort -u)
          for library in $libraries; do
            label="-libs-API-change-$library"
            # Only libraries with a label are labelled (Examples, Geo, ... have none).
            if gh api "repos/$REPO/labels/$label" --silent 2>/dev/null; then
              echo "$label"
              gh pr edit "$PR" --repo "$REPO" --add-label "$label"
            else
              echo "No label $label exists; skipped"
            fi
          done | tee -a "$GITHUB_STEP_SUMMARY"
