name: Set up Rust
description: >-
  The Cargo cache for a job that compiles Rust. The toolchain itself comes from
  `rust-toolchain.toml`: rustup installs it on the first `cargo` call. Only `develop` saves the
  cache, so pull requests share one warm cache instead of each writing their own.
inputs:
  shared-key:
    description: >-
      `Swatinem/rust-cache` key shared by the jobs that build the same crates (`wasm-parser` for
      the GUI's parser).
    required: true
  save:
    description: >-
      Whether this job saves the cache on `develop` ("true", the default). Jobs sharing a key pass
      "false" except the one that compiles the most, so that it decides the entry.
    required: false
    default: "true"
  workspaces:
    description: >-
      `Swatinem/rust-cache`'s `workspaces`: the Cargo workspace and its target directory. The
      engine jobs build into `../cargo-target` (Note [The Engine's Cargo Target Directory] in
      `engine-checks-platform.yml`).
    required: false
    default: ". -> target"
runs:
  using: composite
  steps:
    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/develop' && inputs.save == 'true' }}
        shared-key: ${{ inputs.shared-key }}
        workspaces: ${{ inputs.workspaces }}
